<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fd3ff">
<meta name="game-build" content="v45-landing-camera-composition">
<title>둥실둥실 낙하대 · 착지 화면 구성</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const bearParachuteRigArt=new Image();bearParachuteRigArt.src='assets/characters/bear-parachute-rig.webp';
const bearFreefallArt=new Image();bearFreefallArt.src='assets/characters/bear-freefall.webp';
const planeArt=new Image();planeArt.src='assets/vehicles/pilot-plane.webp';
const islandBG=new Image();islandBG.src='assets/background/island-map.webp';
let W,H,DPR;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

const WORLD=4200,GROUND=WORLD-90,MAXALT=1200,PLANE_Y=170,START_Y=PLANE_Y-16,BONUS_ALT=350;
const OL='#4a3a33';
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),easeOut=p=>1-(1-p)*(1-p);
const CHARS=[
  {name:'몽이',kind:'bear',body:'#e88e4a',ear:'#9d613e',chute:['#ed7832','#fff0d1'],trait:'조종사',steer:1,wind:1,fall:1,flare:1}
];
const PARACHUTES=[
  {name:'주황 아이보리 캐노피',desc:'기본 캐노피',control:1,wind:1,fall:1,flare:1,open:1,wing:1,panels:6}
];
const SITES=[
  {name:'목장 운동장',icon:'🐄',kind:'pasture',x:.52,mapU:.16,mapV:.75,targetW:76,wind:.92,focus:'넓은 울타리 안 표적에 착지'},
  {name:'강변 부표',icon:'🛟',kind:'buoy',x:.52,mapU:.12,mapV:.57,targetW:54,wind:1.16,moveAmp:.065,moveRate:1.15,focus:'좌우로 움직이는 부표에 착지'},
  {name:'옥상 착륙장',icon:'🏠',kind:'roof',x:.52,mapU:.75,mapV:.54,targetW:58,wind:1.08,focus:'좁은 옥상 표적에 착지'}
];
const WEATHERS=[
  {name:'맑음',icon:'☀',wind:0.9,fall:1,dive:0.96,flare:1,open:0.96,gust:0.72,kind:'clear'},
  {name:'돌풍',icon:'➜',wind:1.3,fall:1.02,dive:1.04,flare:0.94,open:1,gust:1.5,kind:'wind'}
];

// ---------- 사운드 ----------
let AC=null;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}else if(AC.state==='suspended')AC.resume()}
function sfx(f,d=.12,type='sine',v=.15,slide=0){
  if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),n+d);
  g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d);
}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

// ---------- 안전 개산 고도(실제 물리로 계산) ----------
function surfToAlt(px){return px/(GROUND-22-START_Y)*MAXALT}
const DANGER_ALT=(()=>{
  for(let d=0;d<3000;d+=5){
    let y=0,vy=680,c=0;const dt=1/60;
    while(y<d){c=Math.min(1,c+dt/.6);const tv=680-585*easeOut(c);vy+=(tv-vy)*Math.min(1,(3+5*c)*dt);y+=vy*dt}
    if(vy<190)return Math.round(surfToAlt(d));
  }return 300;
})();
function dangerThreshold(){if(!weather||!gear||!P)return DANGER_ALT;const factor=weather.dive*weather.fall*gear.fall*P.ch.fall*weather.open*gear.open/(Math.max(.5,weather.flare*gear.flare*P.ch.flare));return clamp(Math.round(DANGER_ALT*factor),120,300)}

// ---------- 상태 ----------
let G={stage:1,jump:0,total:0,phase:'title',routeStars:[0,0,0],routePoints:0};
let P,plane,target,wind,weather,gear,site,stars=[],clouds=[],parts=[],popups=[];
let camY=0,t=0;
const input={down:false,x:0,y:0,startX:0,startY:0,flare:0,left:false,right:false};
for(let i=0;i<8;i++)clouds.push({x:Math.random()*400,y:Math.random()*800,s:rnd(.6,1.3)});

function newJump(){
  const s=G.stage,ch=CHARS[0];
  gear=PARACHUTES[0];weather=WEATHERS[Math.floor(Math.random()*WEATHERS.length)];site=SITES[G.jump%SITES.length];
  const dir=Math.random()<.5?1:-1;
  plane={x:dir>0?W*.12:W*.88,y:PLANE_Y,vx:dir*(150+s*12)};
  const baseWind=(Math.random()<.5?-1:1)*Math.min(32+s*17,115)*rnd(.75,1.15)*site.wind;
  const gusts=[{alt:520,dir:Math.random()<.5?-1:1,power:48*weather.gust,width:105,charge:0,mastered:false},{alt:270,dir:Math.random()<.5?-1:1,power:62*weather.gust,width:82,charge:0,mastered:false}];
  wind={v:baseWind,current:baseWind,phase:rnd(0,Math.PI*2),active:null,gusts};
  const tw=site.targetW||76;
  const targetX=W*(site.x??.52);target={x:targetX,baseX:targetX,w:tw,vx:0,phase:rnd(0,Math.PI*2),moveAmp:site.moveAmp?W*site.moveAmp:0,moveRate:site.moveRate||0};
  P={x:plane.x,y:START_Y,vx:0,vy:0,ch,state:'plane',chute:0,openAlt:null,stars:0,rot:0,bank:0,spin:0,flare:0,flareGood:false,flareAt:null,flareCallout:false,flareUsed:false,flareHold:0,gustPts:0,landT:0,result:null};
  stars=[];const routePhase=rnd(0,Math.PI*2),routeStart=plane.x,routeEnd=target.x;for(let i=0;i<6;i++){const u=i/5,y=650+u*(GROUND-520-650),sway=Math.sin(u*Math.PI*2+routePhase)*W*.16,x=clamp(routeStart+(routeEnd-routeStart)*u+sway,30,W-30);stars.push({x,y,got:false})}
  clouds=[];for(let i=0;i<16;i++)clouds.push({x:Math.random()*W,y:rnd(260,GROUND-600),s:rnd(.6,1.4)});
  camY=0;G.phase='play';
}
function targetFutureX(seconds=0){
  if(!target||site?.kind!=='buoy')return target?.x??0;
  return clamp(target.baseX+Math.sin((t+seconds)*target.moveRate+target.phase)*target.moveAmp,target.w/2,W-target.w/2);
}
function alt(y){return Math.max(0,Math.round(surfToAlt(GROUND-22-y)))}
function burst(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-160,160),vy:rnd(-260,-40),life:rnd(.4,.8),c,s:rnd(2,4)})}
function pop(text,x,y,col,size=22){popups.push({text,x,y,col,size,t:0})}

function jump(){P.state='fall';P.vx=plane.vx*.5;P.vy=-140;sfx(520,.15,'triangle',.15,300);pop('뛰어내려!',W/2,H*.42-44,'#4a3a33',22)}
function openChute(){P.state='chute';P.openAlt=alt(P.y);sfx(300,.25,'sine',.18,500);buzz(20);
  if(P.openAlt<BONUS_ALT)pop(P.openAlt<dangerThreshold()?'늦었다?!':'과감해!',W/2,H*.42-72,'#ff9f1c',24)}

function land(){
  P.touchSpeed=P.vy;
  const s=P.state==='chute'&&P.vy<190;
  const d=Math.abs(P.x-target.x);
  const soft=s&&P.flareGood&&P.vy<120;
  let acc=0,label;
  if(!s)label=site.kind==='pasture'?'울타리 밖에 착지!':site.kind==='buoy'?'부표를 놓쳤어요!':site.kind==='roof'?'옥상 밖으로 벗어났어요!':'아이고, 꽈당!';
  else if(d<target.w*.075){acc=100;label='퍼펙트!'}
  else if(d<target.w*.28){acc=60;label='좋아요!'}
  else if(d<target.w*.5){acc=30;label='아슬아슬!'}
  else label=site.kind==='buoy'?'부표를 놓쳤어요':site.kind==='roof'?'옥상 표적을 벗어났어요':'풀밭 착지';
  const bold=(s&&acc>0&&P.openAlt<BONUS_ALT)?Math.round(clamp((BONUS_ALT-P.openAlt)/Math.max(40,BONUS_ALT-dangerThreshold())*100,0,100)):0;
  const starPts=P.stars*10,windPts=P.gustPts||0;
  const multiplier=s&&P.openAlt!==null&&P.openAlt<BONUS_ALT?1.5:1;
  const missCM=Math.round(d/Math.max(1,W)*3000);
  let bestCM=null,newBest=false;
  if(s&&acc>0){try{const old=localStorage.getItem('parachute-best-cm');bestCM=old===null?null:Number(old);newBest=bestCM===null||missCM<bestCM;if(newBest){bestCM=missCM;localStorage.setItem('parachute-best-cm',String(bestCM))}}catch(e){bestCM=missCM}}
  const pts=s?Math.round((acc+starPts+windPts+(soft&&acc>0?20:0))*multiplier)+Math.min(bold,100):Math.floor((starPts+windPts)/2);
  const rating=!s?0:(acc===100&&soft?3:acc===100?2:acc>0?1:0);
  G.routeStars[G.jump%SITES.length]=rating;G.routePoints+=pts;
  P.result={safe:s,soft,rating,softPts:soft&&acc>0?20:0,acc,bold:Math.min(bold,100),starPts,windPts,pts,label,missCM,bestCM,newBest,multiplier,onMat:s&&acc>0};
  P.state='landed';P.vx=0;P.vy=0;P.landT=0;G.total+=pts;
  if(!s){sfx(160,.35,'sawtooth',.12,-100);buzz(120);burst(P.x,P.y+18,site.kind==='pasture'?'#e6c56e':'#a0794f',18);pop(site.kind==='pasture'?'쿵!':'앗!',W/2,H*.42-52,'#806743',22);if(site.kind==='pasture')setTimeout(()=>pop('음메~!',W/2,H*.42-24,'#806743',18),180)}
  else if(acc===100){[660,880,1100].forEach((f,i)=>setTimeout(()=>sfx(f,.18,'triangle',.14),i*90));burst(P.x,P.y,'#ffd84d',soft?30:24);buzz(soft?55:40);pop(soft?'사뿐! +20':'정중앙 착지!',W/2,H*.42-52,soft?'#ff8fab':'#ffd84d',22)}
  else{sfx(soft?780:660,.15,'triangle',.12);burst(P.x,P.y+10,soft?'#ffe9a8':'#ffffff',soft?22:14);pop(soft?'사뿐! +20':acc>0?'착!':'아슬아슬!',W/2,H*.42-52,soft?'#ff8fab':'#f0b44b',20)}
}
function next(){const routeEnd=(G.jump+1)%SITES.length===0;G.jump++;if(routeEnd){G.stage++;G.routeStars=[0,0,0];G.routePoints=0}newJump()}

// ---------- 업데이트 ----------
function update(dt){
  t+=dt;
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.life-=dt}parts=parts.filter(p=>p.life>0);
  for(const p of popups)p.t+=dt;popups=popups.filter(p=>p.t<1.1);
  if(G.phase!=='play')return;
  if(site?.kind==='buoy'&&target){const now=targetFutureX(0),ahead=targetFutureX(.02);target.x=now;target.vx=(ahead-now)/.02}
  plane.x+=plane.vx*dt;
  if(P.state==='plane'){
    if(plane.vx>0&&plane.x>W+90)plane.x=-90;if(plane.vx<0&&plane.x<-90)plane.x=W+90;
    P.x=plane.x;P.y=START_Y;
  }

  if(P.state==='fall'||P.state==='chute'){
    let steer=(input.right?1:0)-(input.left?1:0);
    if(input.down)steer=P.state==='chute'?clamp((input.x-input.startX)/44,-1,1):clamp((input.x-P.x)/50,-1,1);
    if(P.state==='fall'){
      const dive=weather.dive*P.ch.fall;
      P.vy=Math.min(P.vy+950*dive*dt,680*dive);
      P.vx+=(steer*1050*P.ch.steer+wind.v*.55*weather.wind*site.wind*P.ch.wind-P.vx*1.55)*dt;P.vx=clamp(P.vx,-330,330);
      P.bank+=(steer*P.ch.steer-P.bank)*Math.min(1,dt*8);
    }else{
      P.chute=Math.min(1,P.chute+dt/(.6*gear.open*weather.open));const e=easeOut(P.chute);
      const currentAlt=alt(P.y);wind.current=wind.v+Math.sin(t*1.65+wind.phase)*14;wind.active=null;
      const gust=wind.gusts.find(g=>Math.abs(currentAlt-g.alt)<g.width);
      if(gust){const strength=1-Math.abs(currentAlt-gust.alt)/gust.width;wind.active=gust;wind.current+=gust.dir*gust.power*strength;
        if(!gust.entered){gust.entered=true;pop('돌풍 구간! 반대로 조종해요',W/2,H*.42-82,'#4f87e8',19);sfx(420,.12,'triangle',.1,120)}
        const fighting=Math.sign(steer)===-gust.dir&&Math.abs(steer)>.35;gust.charge=fighting?gust.charge+dt:Math.max(0,gust.charge-dt*.55);
        if(gust.charge>.42&&!gust.mastered){gust.mastered=true;P.gustPts+=25;pop('바람 읽기! +25',W/2,H*.42-48,'#ffb52e',22);burst(P.x,P.y,'#fff2a8',12);sfx(720,.16,'triangle',.13,260);buzz(18)}
      }
      if(P.flareHold>0){P.flareHold=Math.max(0,P.flareHold-dt);P.flare=1}else P.flare=Math.max(0,P.flare-dt*2.4);
      if(currentAlt<=90&&currentAlt>12&&!P.flareCallout){P.flareCallout=true;pop('브레이크 타이밍!',W/2,H*.42-52,'#e66d91',20);sfx(620,.1,'triangle',.08,150)}
      
      const pilotBrake=gear.flare*weather.flare*P.ch.flare;
      const tv=(680-585*e-78*P.flare*pilotBrake)*weather.fall*gear.fall*P.ch.fall;P.vy+=(tv-P.vy)*Math.min(1,(3+6*P.chute+5*P.flare)*dt);
      P.bank+=(steer*P.ch.steer-P.bank)*Math.min(1,dt*(steer===0?4.2:9.0)*gear.control);
      P.vx+=(P.bank*1180*gear.control+wind.current*1.55*e*weather.wind*site.wind*gear.wind*P.ch.wind-P.vx*1.05)*dt;P.vx=clamp(P.vx,-390,390);
    }
    P.spin*=Math.pow(.05,dt);
    P.rot+=((P.state==='fall'?steer*.35:P.bank*.3+P.vx/650)-P.rot)*Math.min(1,5*dt);
    P.x+=P.vx*dt;P.y+=P.vy*dt;
    if(P.x<16){P.x=16;P.vx=Math.abs(P.vx)*.4}if(P.x>W-16){P.x=W-16;P.vx=-Math.abs(P.vx)*.4}
    for(const s of stars)if(!s.got&&Math.hypot(s.x-P.x,s.y-P.y)<32){s.got=true;P.stars++;sfx(880+P.stars*40,.1,'triangle',.12);burst(s.x,s.y,'#ffd84d',8);pop('+10',W/2,H*.42-48,'#ffb300',18)}
    const surf=GROUND-22;
    if(P.y>=surf){P.y=surf;land()}
    camY=clamp(P.y-H*.38,0,WORLD-H);
  }else if(P.state==='landed'){
    P.landT+=dt;P.chute=Math.max(0,P.chute-dt*2);
  }
}

// ---------- 그리기 도우미 ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,size,col,align='center',stroke=true){
  ctx.font=`800 ${size}px -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';
  if(stroke){ctx.lineWidth=Math.max(3,size/6);ctx.strokeStyle='#fff';ctx.lineJoin='round';ctx.strokeText(s,x,y)}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function ell(x,y,rx,ry,fill,stroke){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}

function drawChar(x,y,ch,o={}){
  ctx.save();ctx.translate(x,y);ctx.rotate(o.rot||0);ctx.scale(o.scale||1,o.scale||1);if(o.squish)ctx.scale(1.3,.68);
  const pose=o.arms||'down',hands={fall:[[-28,-9],[28,-9]],chute:[[-17,-31],[17,-31]],down:[[-20,14],[20,14]],cheer:[[-22,-26],[22,-26]]}[pose];
  const suit=ch.kind==='bear'?'#e78643':ch.kind==='bunny'?'#83bde8':'#7bc99b';
  if(o.back){
    // 시안의 후면 구도: 얼굴 대신 뒤통수, 비행복과 낙하산 하네스가 보인다.
    ell(0,29,17,4,'rgba(53,67,61,.16)');
    for(const sx of[-1,1]){ell(sx*7,22,7,5,ch.kind==='bear'?'#936042':ch.ear,OL);ell(sx*7,23,3,2,'#f6d7a2')}
    ell(0,7,13,17,OL);ell(0,7,10.5,14,suit);
    // 등 뒤 하네스와 작은 낙하산 팩
    ctx.strokeStyle='#704f3c';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-9,-3);ctx.lineTo(8,16);ctx.moveTo(9,-3);ctx.lineTo(-8,16);ctx.stroke();
    rr(-7,1,14,13,3);ctx.fillStyle=ch.kind==='bear'?'#9a6642':'#6f8a79';ctx.fill();ctx.strokeStyle='#594538';ctx.lineWidth=1.5;ctx.stroke();rr(-3,5,6,5,1.5);ctx.fillStyle='#f6d47e';ctx.fill();ctx.stroke();
    // 팔을 위로 들어 낙하산 줄을 잡는다.
    for(let i=0;i<2;i++){const sx=i?1:-1,[hx,hy]=hands[i];ctx.lineCap='round';ctx.lineWidth=11;ctx.strokeStyle=OL;ctx.beginPath();ctx.moveTo(sx*9,-2);ctx.quadraticCurveTo(sx*17,-13,hx,hy);ctx.stroke();ctx.lineWidth=7;ctx.strokeStyle=suit;ctx.stroke();ctx.lineWidth=2.5;ctx.strokeStyle='#ffe1ad';ctx.beginPath();ctx.moveTo(sx*13,hy*.72);ctx.lineTo(sx*17,hy*.72);ctx.stroke();ell(hx,hy,5,5,ch.body,OL)}
    if(ch.kind==='bunny'){for(const sx of[-1,1]){ctx.save();ctx.translate(sx*8,-27);ctx.rotate(sx*.13);ell(0,0,5.5,13,ch.body,OL);ell(0,1,2.5,8,ch.ear);ctx.restore()}}
    if(ch.kind==='bear'){for(const sx of[-1,1]){ell(sx*13,-17,7,7,ch.body,OL);ell(sx*13,-17,3.5,3.5,ch.ear)}}
    if(ch.kind==='chick'){ctx.strokeStyle=OL;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-2,-24);ctx.quadraticCurveTo(-6,-34,0,-31);ctx.quadraticCurveTo(5,-35,3,-23);ctx.stroke()}
    ell(0,-15,17,17,OL);ell(0,-15,14,14,ch.body);
    // 뒤통수에 살짝 보이는 털결
    for(const q of[-7,-2,3,8]){ctx.strokeStyle='rgba(117,78,47,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(q,-25);ctx.quadraticCurveTo(q-2,-21,q,-18);ctx.stroke()}
    if(ch.kind==='bear'){ctx.save();ctx.translate(0,-29);ctx.strokeStyle='#6c4934';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-12,0);ctx.quadraticCurveTo(0,5,12,0);ctx.stroke();for(const sx of[-6,6]){ell(sx,0,4.5,4.5,'#bde9f3','#6c4934');ell(sx,0,2.3,2.3,'#6c4934')}ctx.restore()}
    ctx.restore();return;
  }
  // soft shadow and little flight boots
  ell(0,29,17,4,'rgba(53,67,61,.16)');
  for(const sx of[-1,1]){ell(sx*7,22,7,5,ch.kind==='bear'?'#936042':ch.ear,OL);ell(sx*7,22,2.2,1.5,'#fff0cc')}
  // arms, cuff bands and paws
  for(let i=0;i<2;i++){const sx=i?1:-1,[hx,hy]=hands[i];ctx.lineCap='round';ctx.lineWidth=11;ctx.strokeStyle=OL;ctx.beginPath();ctx.moveTo(sx*9,-2);ctx.quadraticCurveTo(sx*15,-10,hx,hy);ctx.stroke();ctx.lineWidth=7;ctx.strokeStyle=suit;ctx.stroke();ctx.lineWidth=2.5;ctx.strokeStyle='#ffe1ad';ctx.beginPath();ctx.moveTo(sx*(Math.abs(hx)*.68),hy*.72);ctx.lineTo(sx*(Math.abs(hx)*.68+4),hy*.72);ctx.stroke();ell(hx,hy,5,5,ch.body,OL)}
  // padded flight suit body with harness and buckle
  ell(0,7,13,17,OL);ell(0,7,10.5,14,suit);ell(0,-5,7,3,'#ffd89b');
  ctx.strokeStyle='#704f3c';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-8,-2);ctx.lineTo(7,16);ctx.moveTo(8,-2);ctx.lineTo(-7,16);ctx.stroke();

const MAP_TARGET_U=.52,MAP_TARGET_V=.68;
function playerScreenY(){
  const near=1-clamp(alt(P.y)/MAXALT,0,1);
  return H*(.29+.045*near);
}
function islandCamera(){
  const iw=islandBG.naturalWidth||941,ih=islandBG.naturalHeight||1670;
  const baseScale=Math.max(W/iw,H/ih),drawW=iw*baseScale,drawH=ih*baseScale;
  const left=(W-drawW)/2,top=(H-drawH)/2;
  const progress=P?1-clamp(alt(P.y)/MAXALT,0,1):0;
  const zoom=1+1.85*Math.pow(progress,2.5),anchorY=playerScreenY();
  return {iw,ih,baseScale,drawW,drawH,left,top,zoom,anchorY};
}
function mapImagePoint(wx,wy,cam){
  const driftU=site?.kind==='buoy'&&target?(target.x-target.baseX)/W:0;
  const mapU=(site?.mapU??MAP_TARGET_U)+driftU,mapV=site?.mapV??MAP_TARGET_V;
  const u=mapU+(wx-target.x)/W;
  const v=mapV*(1-clamp(alt(wy)/MAXALT,0,1));
  return {x:cam.left+u*cam.drawW,y:cam.top+v*cam.drawH};
}
function mapProject(wx,wy){
  const cam=islandCamera(),p=mapImagePoint(wx,wy,cam),player=mapImagePoint(P.x,P.y,cam);
  const depth=clamp((wy-START_Y)/(GROUND-START_Y),0,1);
  const proximity=1-clamp(alt(P.y)/MAXALT,0,1);
  // 하강 막바지에는 지면 표적을 화면 아래로 보내 지형이 가까워지는 원근감을 만든다.
  // 착지 뒤에는 카메라가 표적과 곰의 발을 다시 맞춰 결과가 한눈에 읽히게 한다.

    const siteHint=site.kind==='pasture'?'넓은 목장 표적 · 울타리 안을 노려요':site.kind==='buoy'?'움직이는 부표 · 물결을 보고 맞춰요':'좁은 옥상 표적 · 바람을 조심해요';
    txt(siteHint,W/2,H*.80,11,'#684f42');return;
  }
  if(P.state==='fall'){
    const bx=W/2,by=H*.83,r=Math.min(58,W*.15),pulse=1+Math.sin(t*5)*.035;
    ctx.save();ctx.translate(bx,by);ctx.scale(pulse,pulse);ell(0,4,r+8,r+8,'rgba(255,255,255,.52)');ell(0,0,r,r,'#f27d75','#a75049');
    ctx.beginPath();ctx.arc(0,-10,r*.42,Math.PI,0);ctx.lineTo(r*.32,-5);ctx.lineTo(-r*.32,-5);ctx.closePath();ctx.fillStyle='#fff3d5';ctx.fill();ctx.strokeStyle='#8c5547';ctx.lineWidth=1.5;ctx.stroke();
    ctx.strokeStyle='#8c5547';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-r*.28,-5);ctx.lineTo(-7,9);ctx.moveTo(r*.28,-5);ctx.lineTo(7,9);ctx.stroke();txt('낙하산 펼치기',0,26,14,'#fff','center',false);ctx.restore();
    txt('늦게 펼치면 보너스 · 너무 늦으면 위험!',W/2,by-r-18,11,'#684f42');return;
  }
  if(P.state==='chute'){
    const a=alt(P.y),flareWindow=a<=90&&a>12;
    const cx=W*.22,cy=H*.75,stickR=37;
    // 왼손 가상 조이스틱: 좌우 드래그가 즉시 조종으로 이어진다.
    ell(cx,cy,stickR+5,stickR+5,'rgba(255,250,238,.58)','#fff');ell(cx,cy,stickR,stickR,'rgba(59,75,85,.28)','rgba(255,255,255,.85)');
    const sx=input.down?clamp((input.x-input.startX)/44,-1,1):0;
    ell(cx+sx*24,cy,19,19,input.down?'#fff0c9':'rgba(255,255,255,.9)','#6d5a4a');
    txt('좌우 조종',cx,cy+56,11,'#fff','center',true);
    const flight=Math.max(0,(GROUND-22-P.y)/Math.max(P.vy,55));
    const steer=(input.right?1:0)-(input.left?1:0),touchSteer=input.down?clamp((input.x-input.startX)/44,-1,1):steer;
    const drift=(wind.current??wind.v)*1.55*easeOut(P.chute)*weather.wind*site.wind*gear.wind*P.ch.wind;
    const aim=touchSteer*820*gear.control*P.ch.steer+drift;
    const predictedX=clamp(P.x+aim*flight+(P.vx-aim)*(1-Math.exp(-1.35*flight))/1.35,16,W-16),dx=predictedX-targetFutureX(flight);
    let hint;
    if(flareWindow)hint=P.flareUsed?(P.flareGood?'착지 타이밍 성공! 표적을 향해 조종':'표적을 향해 계속 조종'):'초록 구간에 오른쪽 착지 버튼을 눌러요';
    else if(a<150)hint='표적선을 맞추며 착지 타이밍을 기다려요';
    else if(Math.abs(dx)<target.w*.14)hint='예상 착지선이 표적 중심에 가까워요!';
    else hint=dx<0?'착지 예상이 왼쪽 · 오른쪽으로 조종':'착지 예상이 오른쪽 · 왼쪽으로 조종';
    const baseY=H*.88;rr(W*.28,baseY-19,W*.44,38,19);ctx.fillStyle='rgba(255,250,238,.94)';ctx.fill();ctx.strokeStyle='rgba(124,91,67,.28)';ctx.lineWidth=1.2;ctx.stroke();txt(hint,W*.50,baseY,12.5,flareWindow?'#d94f79':'#684f42','center',false);
    if(flareWindow){
      const bx=W*.84,by=H*.75,r=Math.min(43,W*.115),sweet=a<=68&&a>=24,pulse=1+Math.sin(t*7)*.045;
      ctx.save();ctx.translate(bx,by);ctx.scale(pulse,pulse);ell(0,3,r+5,r+5,'rgba(255,255,255,.55)');ell(0,0,r,r,sweet?'#71c979':'#f2b94f',sweet?'#328346':'#986623');
      ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r-5,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp((90-a)/78,0,1));ctx.stroke();
      txt(P.flareUsed?'완료':'착지',0,-6,15,'#fff','center',true);txt(P.flareUsed?'':'TAP!',0,15,13,'#fff5c0','center',true);ctx.restore();
      txt(sweet?'지금!':a>68?'조금 더 기다려요':'늦기 전에 눌러요',bx,by+r+15,10,sweet?'#328346':'#684f42','center',false);
    }
  }
}
function drawCard(){
  if(P.landT<.65)return;
  const r=P.result,a=Math.min(1,(P.landT-.65)*5),cw=Math.min(W-28,330),chh=156,x=(W-cw)/2,y=H*.035+(1-a)*14;
  ctx.save();ctx.globalAlpha=a;
  rr(x,y,cw,chh,23);ctx.fillStyle='rgba(255,250,239,.97)';ctx.shadowColor='rgba(70,52,42,.2)';ctx.shadowBlur=16;ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(124,91,67,.24)';ctx.lineWidth=1.4;ctx.stroke();
  const funny=site.kind==='pasture'&&(r.label.includes('음메')||r.label.includes('울타리')||r.label.includes('건초'));
  const headline=(!r.safe||funny)?r.label:r.newBest?'최고 기록 갱신!':r.acc===100?'정중앙 착지!':r.acc>0?'표적 안착!':'표적을 벗어났어요';
  txt(headline,W/2,y+20,18,!r.safe?'#d36d68':funny?'#b47b37':r.acc===100?'#e76f8b':'#638a70','center',false);
  txt(`중심에서 ${r.missCM}cm`,W/2,y+43,15,'#806b5c','center',false);
  txt(r.bestCM!==null?`최고 기록 ${r.bestCM}cm · ${r.soft?'부드러운 착지':r.safe?'충격이 컸어요':'다시 도전!'}`:(r.soft?'부드러운 착지':r.safe?'충격이 컸어요':'다시 도전!'),W/2,y+62,10.5,'#a17e5b','center',false);
  for(let i=0;i<3;i++){ctx.save();ctx.translate(W/2+(i-1)*32,y+86);drawStar(0,0,12,0);if(i>=r.rating){ctx.globalAlpha*=.28;ctx.fillStyle='#79685c';ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill()}ctx.restore()}
  const routeStars=G.routeStars.reduce((sum,v)=>sum+v,0),routeEnd=G.jump%SITES.length===SITES.length-1;
  const routeLine=routeEnd?`코스 ${G.routePoints}점 · 별 ${routeStars}/9`:`이번 ${r.pts}점 · 코스 별 ${routeStars}/9`;
  txt(routeLine,W/2,y+108,10,'#9b7041','center',false);
  const cta=routeEnd?'다음 코스 시작  ›':`${SITES[(G.jump+1)%SITES.length].name} 이동  ›`;
  rr(W/2-78,y+121,156,26,13);ctx.fillStyle='#f27d75';ctx.fill();txt(cta,W/2,y+134,11,'#fff','center',false);
  ctx.restore();
}
function drawTitle(){
  if(islandBG.complete&&islandBG.naturalWidth){const scale=Math.max(W/islandBG.naturalWidth,H/islandBG.naturalHeight),dw=islandBG.naturalWidth*scale,dh=islandBG.naturalHeight*scale;ctx.drawImage(islandBG,(W-dw)/2,(H-dh)/2,dw,dh)}
  else{const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#a9dcff');sky.addColorStop(1,'#a9d789');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H)}
  ctx.fillStyle='rgba(255,247,225,.36)';ctx.fillRect(0,0,W,H);
  drawCloud(W*.18,H*.25,.72);drawCloud(W*.83,H*.39,.55);
  drawPlane(W*.73,H*.34,1,.48);drawFreefallBear(W*.31,H*.48,-.08,.40);
  rr(W*.10,H*.065,W*.80,H*.19,28);ctx.fillStyle='rgba(255,250,238,.95)';ctx.fill();ctx.strokeStyle='rgba(132,93,63,.30)';ctx.lineWidth=2;ctx.stroke();
  txt('둥실둥실',W/2,H*.12,23,'#bf7149','center',false);txt('낙하대',W/2,H*.195,34,'#74482f','center',false);
  txt('세 곳의 표적에 차례로 착지!',W/2,H*.64,15,'#624b3e');
  rr(W*.18,H*.725,W*.64,60,25);ctx.fillStyle='#f27d75';ctx.fill();ctx.strokeStyle='#a75049';ctx.lineWidth=2;ctx.stroke();
  txt('탭해서 출발!',W/2,H*.725+30,20,'#fff','center',false);
  rr(W*.15,H*.825,W*.70,45,20);ctx.fillStyle='rgba(255,250,238,.88)';ctx.fill();
  txt('뛰어내리기  ·  낙하산 펼치기  ·  마지막 브레이크',W/2,H*.847,10.5,'#725746','center',false);
}
function draw(){
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#6db8ff');sky.addColorStop(1,'#dff4ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  if(G.phase==='title'){drawTitle();return}
  const approach=1-clamp(alt(P.y)/MAXALT,0,1);
  const mapView=P.state==='plane' ? .56 : P.state==='landed' ? 1 : .18+.82*approach;
  ctx.save();if(P.state==='landed'&&P.landT<.30){const kick=clamp(((P.touchSpeed||0)-35)*.075,5,20)*(1-P.landT/.30);ctx.translate(Math.sin(P.landT*76)*kick,Math.cos(P.landT*61)*kick*.68)}
  if(mapView>0)drawAerialMap(mapView);
  if(mapView<1){ctx.save();ctx.globalAlpha=1-mapView;for(const c of clouds){const sy=c.y-camY;if(sy>-60&&sy<H+60)drawCloud(c.x,sy,c.s)}ctx.restore()}
  const cx=W/2,cy=playerScreenY(),rot=P.rot+P.spin*Math.sin(t*25)*.6;
  if(mapView>0){
    const routeVisible=stars.filter(s=>!s.got&&s.y>P.y+18).sort((a,b)=>a.y-b.y);
    if(routeVisible.length){ctx.save();ctx.globalAlpha=.48*mapView;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#fff4bd';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(W/2,playerScreenY()+18);for(const s of routeVisible){const q=mapProject(s.x,s.y);ctx.lineTo(q.x,q.y)}ctx.stroke();ctx.strokeStyle='#f5bd4d';ctx.lineWidth=2.5;ctx.setLineDash([3,9]);ctx.beginPath();ctx.moveTo(W/2,playerScreenY()+18);for(const s of routeVisible){const q=mapProject(s.x,s.y);ctx.lineTo(q.x,q.y)}ctx.stroke();ctx.restore()}
    for(const s of routeVisible){const q=mapProject(s.x,s.y);if(q.y>-30&&q.y<H+30)drawStar(q.x,q.y+Math.sin(t*3+s.x)*2,10*q.scale,t)}
    ctx.save();ctx.globalAlpha=mapView;drawTarget();ctx.restore();
  }else{
    for(const s of stars)if(!s.got){const sy=s.y-camY;if(sy>-30&&sy<H+30)drawStar(s.x,sy+Math.sin(t*3+s.x)*3,12,t)}
    if(P.state==='fall'&&P.vy>450){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;for(let i=0;i<7;i++){const lx=(i*97+Math.floor(t*30)*53)%W,ly=((i*131-t*900)%H+H)%H;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx,ly+40);ctx.stroke()}}
  }
  if(P.state==='plane'){
    drawPlane(W*.50,cy-10,Math.sign(plane.vx)||1,.42);drawFreefallBear(W*.53,cy+5,0,.19);
    if(Math.sin(t*5)>-.3)txt('표적이 곰 아래로 올 때 탭!',W/2,H*.57,18,'#ff5c8a');
  }else{
    if(P.state==='fall'&&P.vy>450){ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;for(let i=0;i<7;i++){const lx=(i*97+Math.floor(t*30)*53)%W,ly=cy+((i*41)%120)-60;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx,ly+34);ctx.stroke()}}
    if(P.state==='landed'){
      const r=P.result;
      if(bearParachuteRigArt.complete&&bearParachuteRigArt.naturalWidth){
        const touch=mapProject(P.x,GROUND-22),aspect=bearParachuteRigArt.naturalWidth/bearParachuteRigArt.naturalHeight;
        const rigH=Math.min(W*.84,H*.46*aspect)*(gear?.wing||1)*.72/aspect;
        const settle=Math.max(0,1-P.landT/.48),impact=clamp((P.touchSpeed-70)/240,0,1);
        const shadowFade=Math.max(.22,1-P.landT*.75);ctx.save();ctx.globalAlpha=shadowFade;ell(cx,touch.y+5,30+impact*12,7+impact*3,'rgba(74,58,51,.30)');ctx.restore();
        if(settle>0){ctx.save();ctx.globalAlpha=settle*.82;ctx.strokeStyle=r.safe?'#fff0a8':'#e8d6bb';ctx.lineWidth=2+impact*2;ctx.beginPath();ctx.ellipse(cx,touch.y+3,18+(1-settle)*(42+impact*12),5+(1-settle)*(12+impact*5),0,0,Math.PI*2);ctx.stroke();ctx.restore()}
        const hop=r.safe&&r.acc>0?Math.sin(Math.min(1,P.landT/.52)*Math.PI)*10:0;
        const tumble=r.safe?0:Math.sin(Math.min(1,P.landT/.28)*Math.PI)*.16;
        const squash=(1-easeOut(clamp(P.landT/.16,0,1)))*(.34+impact*.66),rigY=touch.y-rigH*.237-hop;
        ctx.save();ctx.translate(cx,rigY+rigH*.48);ctx.scale(1+squash*.12,1-squash*.16);drawParachuteRig(0,-rigH*.48,tumble,.72);ctx.restore();
      }else if(r.safe){drawChute(cx,cy,P.chute,P.ch,0,1.35);drawFreefallBear(cx,cy,0,.40)}
      else{drawFreefallBear(cx,cy+8,Math.sin(Math.min(1,P.landT/.28)*Math.PI)*.16,.40);for(let i=0;i<3;i++){const a=t*4+i*2.1;drawStar(cx+Math.cos(a)*20,cy-14+Math.sin(a)*5,5,a)}}
    }else if(P.state==='chute'&&drawParachuteRig(cx,cy,rot+P.bank*.18,.72)){
      // 줄을 잡은 합성 리그가 조종 방향으로 함께 기울어진다.
    }else if(P.state==='fall'){drawFreefallBear(cx,cy,rot*.25,.40)}
    else{drawChute(cx,cy,P.chute,P.ch,rot+P.bank*.28,1.35);drawFreefallBear(cx,cy,rot*.25,.40)}
  }
  for(const p of parts){const q=mapView>0?mapProject(p.x,p.y):{x:p.x,y:p.y-camY,scale:1};ctx.globalAlpha=Math.min(1,p.life*2);ell(q.x,q.y,p.s*q.scale,p.s*q.scale,p.c)}ctx.globalAlpha=1;
  for(const p of popups){ctx.globalAlpha=1-p.t/1.1;txt(p.text,p.x,p.y-p.t*40,p.size,p.col)}ctx.globalAlpha=1;
  ctx.restore();drawWeatherFX();drawHUD();drawButton();if(P.state==='landed')drawCard();
}
// ---------- 입력 ----------
function action(x,y){
  if(G.phase==='title'){G.stage=1;G.jump=0;G.total=0;G.routeStars=[0,0,0];G.routePoints=0;newJump();return true}
  if(P.state==='plane'){jump();return true}
  if(P.state==='fall'&&(x==null||Math.hypot(x-W/2,y-H*.83)<Math.min(76,W*.2))){openChute();return true}
  if(P.state==='chute'){const a=alt(P.y),bx=W*.84,by=H*.75,r=Math.min(52,W*.13);if(a<=90&&a>12&&Math.hypot(x-bx,y-by)<r){if(!P.flareUsed){P.flareUsed=true;P.flareAt=a;P.flareGood=a<=68&&a>=24;P.flare=1;P.flareHold=.52;P.flareCallout=true;if(P.flareGood){pop('타이밍 성공!',W/2,H*.42-52,'#ff5c8a',21);sfx(760,.14,'triangle',.12,220);buzz(18)}else{pop(a>68?'조금 빨라요!':'조금 늦었어요!',W/2,H*.42-52,'#f0a13d',19);sfx(430,.12,'triangle',.1,-80)}}return true}}
  if(P.state==='landed'&&P.landT>.65){next();return true}
  return false;
}
cv.addEventListener('pointerdown',e=>{audioInit();if(action(e.clientX,e.clientY))return;input.down=true;input.x=input.startX=e.clientX;input.y=input.startY=e.clientY;cv.setPointerCapture?.(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(input.down){input.x=e.clientX;input.y=e.clientY}});
['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,()=>{input.down=false;input.flare=0}));
addEventListener('keydown',e=>{audioInit();if(e.key==='ArrowLeft')input.left=true;if(e.key==='ArrowRight')input.right=true;if(e.key===' '){e.preventDefault();action()}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')input.left=false;if(e.key==='ArrowRight')input.right=false});

let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
