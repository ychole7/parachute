<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fd3ff">
<meta name="game-build" content="v23-harness-alignment">
<title>둥실둥실 낙하대</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const bearArt=new Image();bearArt.src='assets/characters/bear-back.png';
const canopyArt=new Image();canopyArt.src='assets/parachutes/orange-cream-canopy.png';
let W,H,DPR;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

const WORLD=4200,GROUND=WORLD-90,MAXALT=1200,PLANE_Y=170,START_Y=PLANE_Y-16,BONUS_ALT=350;
const OL='#4a3a33';
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),easeOut=p=>1-(1-p)*(1-p);
function riverWorldX(y){return W*(.52+.3*Math.sin((y-GROUND)/WORLD*4+1.45)+.045*Math.sin(y/WORLD*12))}
const CHARS=[
  {name:'토토',kind:'bunny',body:'#fff4f0',ear:'#ffc4d0',chute:['#ff8fab','#fff3b0'],trait:'민첩 조종',steer:1.22,wind:0.92,fall:0.96,flare:1.08},
  {name:'삐약',kind:'chick',body:'#ffe27a',ear:'#ffb347',chute:['#7ed6a7','#ffffff'],trait:'가벼운 낙하',steer:1,wind:1.18,fall:0.9,flare:1},
  {name:'몽이',kind:'bear',body:'#dcae80',ear:'#b5835a',chute:['#7ab8ff','#ffd6e8'],trait:'강풍 버팀',steer:0.88,wind:0.76,fall:1.12,flare:0.98}
];
const PARACHUTES=[
  {name:'밸런스 캐노피',desc:'조종과 속도가 고른 기본형',control:1,wind:1,fall:1,flare:1,open:1,wing:1,panels:6},
  {name:'훈련용 캐노피',desc:'천천히 내려와 착지하기 쉬워요',control:1.18,wind:0.78,fall:0.88,flare:1.18,open:1.12,wing:1.08,panels:8},
  {name:'스피드 캐노피',desc:'빠르고 민첩하지만 바람에 약해요',control:1.08,wind:1.22,fall:1.12,flare:0.84,open:0.86,wing:0.88,panels:5}
];
const SITES=[
  {name:'초등학교 운동장',icon:'⚑',kind:'school',x:.22,target:1.12,wind:0.72,moving:false,focus:'넓은 표적 · 기본 착지'},
  {name:'강변 부표',icon:'◉',kind:'lake',x:.79,target:0.7,wind:1.38,moving:false,focus:'고정 표적 · 횡풍 보정'},
  {name:'아파트 옥상',icon:'⌂',kind:'roof',x:.56,target:0.58,wind:1.28,moving:false,focus:'좁은 표적 · 건물 돌풍'}
];
const WEATHERS=[
  {name:'맑음',icon:'☀',wind:0.88,fall:1,dive:0.96,flare:1,open:0.96,gust:0.72,kind:'clear'},
  {name:'돌풍',icon:'➜',wind:1.32,fall:1.02,dive:1.04,flare:0.94,open:1,gust:1.52,kind:'wind'},
  {name:'상승기류',icon:'☁',wind:0.98,fall:0.84,dive:0.92,flare:1.08,open:0.98,gust:0.64,kind:'thermal'},
  {name:'소나기',icon:'☂',wind:1.18,fall:1.13,dive:1.12,flare:0.88,open:1.14,gust:1.18,kind:'rain'}
];

// ---------- 사운드 ----------
let AC=null;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}else if(AC.state==='suspended')AC.resume()}
function sfx(f,d=.12,type='sine',v=.15,slide=0){
  if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),n+d);
  g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d);
}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

// ---------- 안전 개산 고도(실제 물리로 계산) ----------
function surfToAlt(px){return px/(GROUND-22-START_Y)*MAXALT}
const DANGER_ALT=(()=>{
  for(let d=0;d<3000;d+=5){
    let y=0,vy=680,c=0;const dt=1/60;
    while(y<d){c=Math.min(1,c+dt/.6);const tv=680-585*easeOut(c);vy+=(tv-vy)*Math.min(1,(3+5*c)*dt);y+=vy*dt}
    if(vy<190)return Math.round(surfToAlt(d));
  }return 300;
})();
function dangerThreshold(){if(!weather||!gear||!P)return DANGER_ALT;const factor=weather.dive*weather.fall*gear.fall*P.ch.fall*weather.open*gear.open/(Math.max(.5,weather.flare*gear.flare*P.ch.flare));return clamp(Math.round(DANGER_ALT*factor),120,300)}

// ---------- 상태 ----------
let G={stage:1,jump:0,total:0,phase:'title'};
let P,plane,target,wind,weather,gear,site,gearIndex=0,stars=[],birds=[],clouds=[],parts=[],popups=[],scenery=[];
let camY=0,t=0;
const input={down:false,x:0,y:0,startX:0,startY:0,flare:0,left:false,right:false};
for(let i=0;i<8;i++)clouds.push({x:Math.random()*400,y:Math.random()*800,s:rnd(.6,1.3)});

function newJump(){
  const s=G.stage,ch=CHARS[(G.jump+2)%3];
  gear=PARACHUTES[gearIndex];weather=WEATHERS[Math.floor(Math.random()*WEATHERS.length)];site=SITES[G.jump%SITES.length];
  const dir=Math.random()<.5?1:-1;
  plane={x:dir>0?-90:W+90,y:PLANE_Y,vx:dir*(150+s*12)};
  const baseWind=(Math.random()<.5?-1:1)*Math.min(32+s*17,115)*rnd(.75,1.15)*site.wind;
  const gusts=[{alt:520,dir:Math.random()<.5?-1:1,power:48*weather.gust,width:105,charge:0,mastered:false},{alt:270,dir:Math.random()<.5?-1:1,power:62*weather.gust,width:82,charge:0,mastered:false}];
  if(site.kind==='roof')gusts.push({alt:112,dir:Math.random()<.5?-1:1,power:78*weather.gust,width:48,charge:0,mastered:false});
  wind={v:baseWind,current:baseWind,phase:rnd(0,Math.PI*2),active:null,gusts};
  const tw=clamp(Math.max(150-(s-1)*11,76)*site.target,56,160);
  target={x:clamp(W*site.x,W*.12,W*.88),w:tw,vx:0};
  P={x:plane.x,y:START_Y,vx:0,vy:0,ch,state:'plane',chute:0,openAlt:null,stars:0,rot:0,bank:0,spin:0,flare:0,flareGood:false,gustPts:0,landT:0,result:null};
  stars=[];for(let i=0;i<10+s*2;i++)stars.push({x:rnd(30,W-30),y:rnd(600,GROUND-500),got:false});
  birds=[];if(s>=2)for(let i=0;i<Math.min(s,6);i++)birds.push({x:Math.random()*W,y:rnd(900,GROUND-500),vx:rnd(60,120)*(Math.random()<.5?-1:1),hit:false});
  if(!scenery.length){
    // 도시의 구역은 한 번 생성한 뒤 모든 착지 코스에서 같은 월드 좌표를 공유한다.
    const add=(kind,x,y,size,tone=0)=>scenery.push({kind,x,y,size,tone});
    for(let i=0;i<12;i++){const y=GROUND-2350+i*104;add('mountain',W*(.02+(i%4)*.31),y,rnd(1.05,1.55),i%3)}
    // 아파트 구역이 강 건너 주택가와 이어지도록 중간 블록을 촘촘히 잇는다.
    for(let row=0;row<10;row++)for(let col=0;col<6;col++){
      const y=GROUND-2350+row*177+(col%2)*38;
      const x=W*(.45+col*.083+rnd(-.018,.018));
      if(Math.abs(x-riverWorldX(y))>W*.125)add('building',x,y,rnd(.88,1.28),(row+col)%3);
    }
    // 학교와 맞닿은 주택가는 강 굽이를 따라 이어지고 운동장 주변은 비워 둔다.
    for(let row=0;row<10;row++)for(let col=0;col<6;col++){
      const y=GROUND-2250+row*188+(col%2)*34,x=W*(.025+col*.074+rnd(-.012,.012));
      const riverGap=Math.abs(x-riverWorldX(y))>W*.105,schoolClear=Math.abs(x/W-.22)>.13||y<GROUND-540;
      if(riverGap&&schoolClear)add('house',x,y,rnd(.75,1.02),(row+col)%3);
    }
    // 나무와 작은 공터를 섞어 건물 블록이 한 덩어리로 뭉쳐 보이지 않게 한다.
    for(let i=0;i<112;i++){
      const y=rnd(GROUND-2550,GROUND-45),x=W*rnd(.015,.985);
      if(Math.abs(x-riverWorldX(y))>W*.105 && !(Math.abs(x/W-.22)<.14&&y>GROUND-610))add('tree',x,y,rnd(.68,1.12),i%3);
    }
  }
  clouds=[];for(let i=0;i<16;i++)clouds.push({x:Math.random()*W,y:rnd(260,GROUND-600),s:rnd(.6,1.4)});
  camY=0;G.phase='play';
}
function alt(y){return Math.max(0,Math.round(surfToAlt(GROUND-22-y)))}
function burst(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-160,160),vy:rnd(-260,-40),life:rnd(.4,.8),c,s:rnd(2,4)})}
function pop(text,x,y,col,size=22){popups.push({text,x,y,col,size,t:0})}

function jump(){P.state='fall';P.vx=plane.vx*.5;P.vy=-140;sfx(520,.15,'triangle',.15,300);pop('뛰어내려!',W/2,H*.42-44,'#4a3a33',22)}
function openChute(){P.state='chute';P.openAlt=alt(P.y);sfx(300,.25,'sine',.18,500);buzz(20);
  if(P.openAlt<BONUS_ALT)pop(P.openAlt<dangerThreshold()?'늦었다?!':'과감해!',W/2,H*.42-72,'#ff9f1c',24)}

function land(){
  P.touchSpeed=P.vy;
  const s=P.state==='chute'&&P.vy<190;
  const d=Math.abs(P.x-target.x);
  const soft=s&&P.flareGood&&P.vy<120;
  let acc=0,label;
  if(!s)label='꽈당!';
  else if(d<target.w*.14){acc=100;label='퍼펙트!'}
  else if(d<target.w*.5){acc=60;label='좋아요!'}
  else if(d<target.w*.5+18){acc=30;label='아슬아슬!'}
  else label='풀밭 착지';
  const bold=(s&&acc>0&&P.openAlt<BONUS_ALT)?Math.round(clamp((BONUS_ALT-P.openAlt)/Math.max(40,BONUS_ALT-dangerThreshold())*100,0,100)):0;
  const starPts=P.stars*10,windPts=P.gustPts||0;
  const pts=s?acc+Math.min(bold,100)+starPts+windPts+(soft&&acc>0?20:0):Math.floor((starPts+windPts)/2);
  const rating=!s?0:(acc===100&&soft?3:acc>0?2:1);
  P.result={safe:s,soft,rating,softPts:soft&&acc>0?20:0,acc,bold:Math.min(bold,100),starPts,windPts,pts,label,onMat:s&&acc>0};
  P.state='landed';P.vx=0;P.vy=0;P.landT=0;G.total+=pts;
  if(!s){sfx(160,.35,'sawtooth',.12,-100);buzz(120);burst(P.x,P.y+18,'#a0794f',14)}
  else if(acc===100){[660,880,1100].forEach((f,i)=>setTimeout(()=>sfx(f,.18,'triangle',.14),i*90));burst(P.x,P.y,'#ffd84d',soft?30:20);buzz(soft?55:40);if(soft)pop('사뿐! +20',W/2,H*.42-52,'#ff8fab',22)}
  else{sfx(soft?780:660,.15,'triangle',.12);burst(P.x,P.y+10,soft?'#ffe9a8':'#ffffff',soft?20:10);if(soft&&acc>0)pop('사뿐! +20',W/2,H*.42-52,'#ff8fab',22)}
}
function next(){G.jump++;if(G.jump%3===0)G.stage++;newJump()}

// ---------- 업데이트 ----------
function update(dt){
  t+=dt;
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.life-=dt}parts=parts.filter(p=>p.life>0);
  for(const p of popups)p.t+=dt;popups=popups.filter(p=>p.t<1.1);
  if(G.phase!=='play')return;
  plane.x+=plane.vx*dt;
  if(P.state==='plane'){
    if(plane.vx>0&&plane.x>W+90)plane.x=-90;if(plane.vx<0&&plane.x<-90)plane.x=W+90;
    P.x=plane.x;P.y=START_Y;
  }
  for(const b of birds){b.x+=b.vx*dt;if(b.x<-40)b.x=W+40;if(b.x>W+40)b.x=-40}

  if(P.state==='fall'||P.state==='chute'){
    let steer=(input.right?1:0)-(input.left?1:0);
    if(input.down)steer=P.state==='chute'?clamp((input.x-input.startX)/68,-1,1):clamp((input.x-P.x)/50,-1,1);
    if(P.state==='fall'){
      const dive=weather.dive*P.ch.fall;
      P.vy=Math.min(P.vy+950*dive*dt,680*dive);
      P.vx+=(steer*1050*P.ch.steer+wind.v*.55*weather.wind*site.wind*P.ch.wind-P.vx*1.55)*dt;P.vx=clamp(P.vx,-330,330);
      P.bank+=(steer*P.ch.steer-P.bank)*Math.min(1,dt*8);
    }else{
      P.chute=Math.min(1,P.chute+dt/(.6*gear.open*weather.open));const e=easeOut(P.chute);
      const pullDown=input.down?clamp((input.y-input.startY-22)/48,0,1):0;
      const currentAlt=alt(P.y);wind.current=wind.v+Math.sin(t*1.65+wind.phase)*14;wind.active=null;
      const gust=wind.gusts.find(g=>Math.abs(currentAlt-g.alt)<g.width);
      if(gust){const strength=1-Math.abs(currentAlt-gust.alt)/gust.width;wind.active=gust;wind.current+=gust.dir*gust.power*strength;
        if(!gust.entered){gust.entered=true;pop('돌풍 구간! 반대로 조종해요',W/2,H*.42-82,'#4f87e8',19);sfx(420,.12,'triangle',.1,120)}
        const fighting=Math.sign(steer)===-gust.dir&&Math.abs(steer)>.35;gust.charge=fighting?gust.charge+dt:Math.max(0,gust.charge-dt*.55);
        if(gust.charge>.42&&!gust.mastered){gust.mastered=true;P.gustPts+=25;pop('바람 읽기! +25',W/2,H*.42-48,'#ffb52e',22);burst(P.x,P.y,'#fff2a8',12);sfx(720,.16,'triangle',.13,260);buzz(18)}
      }
      P.flare+=(pullDown-P.flare)*Math.min(1,dt*10);
      if(P.flare>.45&&alt(P.y)<90&&alt(P.y)>12)P.flareGood=true;
      const pilotBrake=gear.flare*weather.flare*P.ch.flare;
      const tv=(680-585*e-72*P.flare*pilotBrake)*weather.fall*gear.fall*P.ch.fall;P.vy+=(tv-P.vy)*Math.min(1,(3+5*P.chute+2*P.flare)*dt);
      P.bank+=(steer*P.ch.steer-P.bank)*Math.min(1,dt*(steer===0?2.8:4.5)*gear.control);
      P.vx+=(P.bank*820*gear.control+wind.current*1.55*e*weather.wind*site.wind*gear.wind*P.ch.wind-P.vx*1.15)*dt;P.vx=clamp(P.vx,-350,350);
    }
    P.spin*=Math.pow(.05,dt);
    P.rot+=((P.state==='fall'?steer*.35:P.bank*.3+P.vx/650)-P.rot)*Math.min(1,5*dt);
    P.x+=P.vx*dt;P.y+=P.vy*dt;
    if(P.x<16){P.x=16;P.vx=Math.abs(P.vx)*.4}if(P.x>W-16){P.x=W-16;P.vx=-Math.abs(P.vx)*.4}
    for(const s of stars)if(!s.got&&Math.hypot(s.x-P.x,s.y-P.y)<32){s.got=true;P.stars++;sfx(880+P.stars*40,.1,'triangle',.12);burst(s.x,s.y,'#ffd84d',8);pop('+10',W/2,H*.42-48,'#ffb300',18)}
    for(const b of birds)if(!b.hit&&Math.hypot(b.x-P.x,b.y-P.y)<34){b.hit=true;P.vx+=Math.sign(b.vx)*260;P.vy*=.8;P.spin=1;sfx(300,.2,'square',.08,-150);buzz(30);pop('앗!',W/2,H*.42-50,'#ff6b6b',24)}
    const surf=GROUND-22;
    if(P.y>=surf){P.y=surf;land()}
    camY=clamp(P.y-H*.38,0,WORLD-H);
  }else if(P.state==='landed'){
    P.landT+=dt;P.chute=Math.max(0,P.chute-dt*2);
  }
}

// ---------- 그리기 도우미 ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,size,col,align='center',stroke=true){
  ctx.font=`800 ${size}px -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';
  if(stroke){ctx.lineWidth=Math.max(3,size/6);ctx.strokeStyle='#fff';ctx.lineJoin='round';ctx.strokeText(s,x,y)}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function ell(x,y,rx,ry,fill,stroke){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}

function drawChar(x,y,ch,o={}){
  ctx.save();ctx.translate(x,y);ctx.rotate(o.rot||0);ctx.scale(o.scale||1,o.scale||1);if(o.squish)ctx.scale(1.3,.68);
  const pose=o.arms||'down',hands={fall:[[-28,-9],[28,-9]],chute:[[-17,-31],[17,-31]],down:[[-20,14],[20,14]],cheer:[[-22,-26],[22,-26]]}[pose];
  const suit=ch.kind==='bear'?'#e78643':ch.kind==='bunny'?'#83bde8':'#7bc99b';
  if(o.back){
    // 시안의 후면 구도: 얼굴 대신 뒤통수, 비행복과 낙하산 하네스가 보인다.
    ell(0,29,17,4,'rgba(53,67,61,.16)');
    for(const sx of[-1,1]){ell(sx*7,22,7,5,ch.kind==='bear'?'#936042':ch.ear,OL);ell(sx*7,23,3,2,'#f6d7a2')}
    ell(0,7,13,17,OL);ell(0,7,10.5,14,suit);
    // 등 뒤 하네스와 작은 낙하산 팩
    ctx.strokeStyle='#704f3c';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-9,-3);ctx.lineTo(8,16);ctx.moveTo(9,-3);ctx.lineTo(-8,16);ctx.stroke();
    rr(-7,1,14,13,3);ctx.fillStyle=ch.kind==='bear'?'#9a6642':'#6f8a79';ctx.fill();ctx.strokeStyle='#594538';ctx.lineWidth=1.5;ctx.stroke();rr(-3,5,6,5,1.5);ctx.fillStyle='#f6d47e';ctx.fill();ctx.stroke();
    // 팔을 위로 들어 낙하산 줄을 잡는다.
    for(let i=0;i<2;i++){const sx=i?1:-1,[hx,hy]=hands[i];ctx.lineCap='round';ctx.lineWidth=11;ctx.strokeStyle=OL;ctx.beginPath();ctx.moveTo(sx*9,-2);ctx.quadraticCurveTo(sx*17,-13,hx,hy);ctx.stroke();ctx.lineWidth=7;ctx.strokeStyle=suit;ctx.stroke();ctx.lineWidth=2.5;ctx.strokeStyle='#ffe1ad';ctx.beginPath();ctx.moveTo(sx*13,hy*.72);ctx.lineTo(sx*17,hy*.72);ctx.stroke();ell(hx,hy,5,5,ch.body,OL)}
    if(ch.kind==='bunny'){for(const sx of[-1,1]){ctx.save();ctx.translate(sx*8,-27);ctx.rotate(sx*.13);ell(0,0,5.5,13,ch.body,OL);ell(0,1,2.5,8,ch.ear);ctx.restore()}}
    if(ch.kind==='bear'){for(const sx of[-1,1]){ell(sx*13,-17,7,7,ch.body,OL);ell(sx*13,-17,3.5,3.5,ch.ear)}}
    if(ch.kind==='chick'){ctx.strokeStyle=OL;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-2,-24);ctx.quadraticCurveTo(-6,-34,0,-31);ctx.quadraticCurveTo(5,-35,3,-23);ctx.stroke()}
    ell(0,-15,17,17,OL);ell(0,-15,14,14,ch.body);
    // 뒤통수에 살짝 보이는 털결

  if(weather.kind==='rain'){ctx.strokeStyle='rgba(116,188,238,.42)';ctx.lineWidth=1.4;for(let i=0;i<22;i++){const x=(i*79+t*95)%W,y=(i*137+t*310)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-8,y+22);ctx.stroke()}}
  else if(weather.kind==='wind'){ctx.strokeStyle='rgba(255,255,255,.42)';ctx.lineWidth=2;for(let i=0;i<12;i++){const x=(i*113+t*150)%W,y=(i*181+t*205)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-18,y+3);ctx.stroke()}}
  else if(weather.kind==='thermal'){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;for(let i=0;i<5;i++){const x=W*(.16+i*.17)+Math.sin(t*2+i)*8,y=H*(.25+i*.12)+(t*18%28);ctx.beginPath();ctx.moveTo(x,y+14);ctx.quadraticCurveTo(x-9,y,x,y-8);ctx.stroke()}}
  ctx.restore();
}

function drawHUD(){
  const box=(x,y,w,h)=>{rr(x,y,w,h,15);ctx.fillStyle='rgba(255,248,231,.96)';ctx.fill();ctx.strokeStyle='rgba(142,99,62,.35)';ctx.lineWidth=1.5;ctx.stroke()};
  box(12,10,112,52);txt(`STAGE ${G.stage}`,18,25,14,'#a45d35','left',false);txt(`${P.ch.name} · ${P.ch.trait}`,18,47,11,'#604735','left',false);
  box(W-76,10,64,52);txt(`${G.total}`,W-44,25,17,'#ef6687','center',false);txt(`★ ${P.stars}`,W-44,47,14,'#dc9d18','center',false);
  // 바람
  const displayWind=(wind.current??wind.v)*weather.wind*site.wind*gear.wind*P.ch.wind;const wv=Math.round(Math.abs(displayWind)/13),d=Math.sign(displayWind);
  ctx.save();ctx.translate(W/2,31);rr(-42,-14,84,28,14);ctx.fillStyle='rgba(255,248,231,.96)';ctx.fill();ctx.strokeStyle='rgba(142,99,62,.3)';ctx.lineWidth=1.5;ctx.stroke();
  txt(wind.active?'돌풍!':`바람 ${wv}`,-8,1,14,wind.active?'#e66b35':'#604735','center',false);
  ctx.strokeStyle='#e89035';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(25-d*10,1);ctx.lineTo(25+d*10,1);ctx.lineTo(25+d*4,-5);ctx.moveTo(25+d*10,1);ctx.lineTo(25+d*4,7);ctx.stroke();ctx.restore();
  if(weather&&gear&&P.state!=='landed'){txt(`${weather.icon} ${weather.name}  ·  ${gear.name}`,W/2,66,11,'#4a3a33','center',false);txt(`목표 · ${site.icon} ${site.name}`,W/2,83,11,'#4a3a33','center',false)}
  // 고도계
  if(P.state==='fall'||P.state==='chute'){
    const x=W-20,y0=90,y1=H-190,yy=a=>y1-a/MAXALT*(y1-y0);
    rr(x-5,y0,10,y1-y0,5);ctx.fillStyle='rgba(255,255,255,.6)';ctx.fill();
    ctx.fillStyle='#ffd84d';ctx.fillRect(x-5,yy(BONUS_ALT),10,yy(dangerThreshold())-yy(BONUS_ALT));
    ctx.fillStyle='#ff6b6b';ctx.fillRect(x-5,yy(dangerThreshold()),10,y1-yy(dangerThreshold()));
    const danger=dangerThreshold(),a=alt(P.y),my=yy(Math.min(a,MAXALT));
    ell(x,my,8,8,'#fff',OL);txt(`${a}m`,x-14,my,13,a<danger?'#ff4d4d':'#4a3a33','right');
  }

}
function drawButton(){
  if(P.state==='chute'){
    const a=alt(P.y),ok=a<110&&a>12;
    const dy=input.y-input.startY,dx=input.x-input.startX;
    const hint=wind.active&&!wind.active.mastered?(input.down&&Math.sign(dx)===-wind.active.dir?'바람을 잘 잡았어요!':'돌풍 반대쪽으로 끌어요!'):input.down&&dy>22?'브레이크 당기는 중!':ok&&P.flare<.15?'착지 준비! 아래로 당겨요':input.down&&Math.abs(dx)>12?(dx<0?'왼쪽으로 기울어요':'오른쪽으로 기울어요'):ok?'지금 아래로 당겨 속도 줄여요':'좌우로 크게 끌어 조종해요';
    txt(hint,W/2,H*.82,15,ok||dy>22?'#ff5c8a':'#4a3a33');
    if(ok){rr(W/2-44,H*.85,88,7,4);ctx.fillStyle='rgba(255,255,255,.8)';ctx.fill();rr(W/2-44,H*.85,88*P.flare,7,4);ctx.fillStyle='#ff8fab';ctx.fill()}
    return;
  }
  if(P.state!=='fall')return;const bx=58,by=H*.75,pulse=1+Math.sin(t*8)*.04;
  ctx.save();ctx.translate(bx,by);ctx.scale(pulse,pulse);
  ell(0,4,46,46,'rgba(0,0,0,.15)');ell(0,0,46,46,P.ch.chute[0],OL);
  ctx.beginPath();ctx.arc(0,4,24,Math.PI,0);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=OL;ctx.lineWidth=2;ctx.stroke();
  txt('펼쳐!',0,22,14,'#4a3a33','center',false);ctx.restore();
}
function drawCard(){
  if(P.landT<.8)return;const r=P.result,a=Math.min(1,(P.landT-.8)*4);
  const cw=Math.min(W-40,300),chh=270,x=(W-cw)/2,y=H*.14+(1-a)*30;
  ctx.save();ctx.globalAlpha=a;rr(x,y,cw,chh,22);ctx.fillStyle='rgba(255,255,255,.96)';ctx.shadowColor='rgba(0,0,0,.18)';ctx.shadowBlur=20;ctx.fill();ctx.shadowBlur=0;
  txt(r.label,W/2,y+30,26,r.safe?(r.acc===100?'#ff5c8a':'#3a6fd8'):'#ff6b6b','center',false);
  txt(`${site.name} · ${site.focus}`,W/2,y+51,10,'#88766d','center',false);
  txt(r.safe?'착지 등급':'안전하게 착지해 보세요',W/2,y+77,12,'#7a6a63','center',false);
  for(let i=0;i<3;i++){
    ctx.save();ctx.translate(W/2+(i-1)*34,y+101);ctx.beginPath();
    for(let j=0;j<10;j++){const ang=-Math.PI/2+j*Math.PI/5,rad=j%2?7:14;const px=Math.cos(ang)*rad,py=Math.sin(ang)*rad;if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.closePath();
    ctx.fillStyle=i<r.rating?'#ffc83d':'#eee7df';ctx.fill();ctx.strokeStyle=i<r.rating?'#e5a51b':'#c9bfb7';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
  }
  const rows=r.safe?[['정확도',r.acc],['과감 보너스',r.bold],['바람 읽기',r.windPts||0],['사뿐 보너스',r.softPts],[`수집 별 ×${P.stars}`,r.starPts]]:[['착지 점수',0],[`수집 별 ×${P.stars} (반만)`,Math.floor(r.starPts/2)],['바람 읽기',Math.floor((r.windPts||0)/2)]];
  rows.forEach((row,i)=>{txt(row[0],x+28,y+124+i*18,12,'#7a6a63','left',false);txt('+'+row[1],x+cw-28,y+124+i*18,12,'#4a3a33','right',false)});
  ctx.fillStyle='#eee';ctx.fillRect(x+24,y+217,cw-48,2);
  txt('합계',x+28,y+237,16,'#4a3a33','left',false);txt('+'+r.pts,x+cw-28,y+237,19,'#ff5c8a','right',false);
  if(P.landT>1.1)txt(G.jump%3===2?`3곳 완료! 다음 라운드 ▶`:`다음 목표 · ${SITES[(G.jump+1)%3].name} ▶`,W/2,y+chh+24,14,'#4a3a33');
  ctx.restore();
}
function drawTitle(){
  // 비행기 문 밖에 펼쳐진 하나의 도시를 먼저 보여 주는 출발 장면
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#69b7f4');sky.addColorStop(.48,'#c4eaff');sky.addColorStop(1,'#edf7e7');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  for(let i=0;i<5;i++){const x=W*(i/4-.08),y=H*(.28+(i%2)*.035);ctx.beginPath();ctx.moveTo(x-W*.16,y+H*.1);ctx.lineTo(x,y-H*.06);ctx.lineTo(x+W*.18,y+H*.1);ctx.closePath();ctx.fillStyle=['#759d83','#83ae89','#6d987e'][i%3];ctx.fill()}
  // 도시의 강, 구릉 주거지, 학교 운동장은 한 풍경 안에서 이어진다.
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();for(let y=H*.3;y<H*.78;y+=12){const x=W*(.58+.16*Math.sin(y/H*4.1)+.045*Math.sin(y/H*8));if(y===H*.3)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle='#73cdd7';ctx.lineWidth=W*.19;ctx.stroke();ctx.strokeStyle='#35afc8';ctx.lineWidth=W*.145;ctx.stroke();ctx.restore();
  for(let i=0;i<34;i++){const row=Math.floor(i/7),col=i%7,x=W*(.04+col*.145+(row%2)*.035),y=H*(.39+row*.073);if(row>1&&x>W*.55&&x<W*.88)continue;const k=1-row*.13;ctx.save();ctx.translate(x,y);ctx.scale(k,k);ell(0,7,17,5,'rgba(45,75,65,.18)');rr(-13,-23,26,31,3);ctx.fillStyle=['#fff0d3','#e5f0ee','#f5d5c2'][i%3];ctx.fill();ctx.strokeStyle='rgba(92,105,91,.5)';ctx.lineWidth=1;ctx.stroke();ctx.beginPath();ctx.moveTo(-15,-22);ctx.lineTo(0,-31);ctx.lineTo(15,-22);ctx.closePath();ctx.fillStyle=['#de8f72','#809abb','#c77e8d'][i%3];ctx.fill();for(let wx=-7;wx<=7;wx+=9){rr(wx-2,-16,4,5,1);ctx.fillStyle='#8bd3e0';ctx.fill()}ctx.restore()}
  // 학교 운동장과 고정된 목표 표식
  ctx.save();ctx.translate(W*.73,H*.52);ctx.rotate(-.08);rr(-W*.19,-H*.055,W*.38,H*.11,14);ctx.fillStyle='#79c878';ctx.fill();ctx.strokeStyle='#fff3dc';ctx.lineWidth=3;ctx.stroke();ctx.strokeStyle='#ef9c80';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(0,0,W*.14,H*.043,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(0,0,W*.095,H*.03,0,0,Math.PI*2);ctx.stroke();ell(0,0,9,5,'#ff8a32','#fff2c9');ctx.restore();
  for(const c of clouds.slice(0,9))drawCloud((c.x+t*8*c.s)%(W+100)-50,c.y%H*.5,c.s*.75);
  // 둥근 비행기 출입문 프레임
  ctx.fillStyle='#e78339';ctx.fillRect(0,0,W,H*.08);ctx.fillRect(0,0,W*.055,H*.72);ctx.fillRect(W*.945,0,W*.055,H*.72);
  ctx.fillStyle='#ffe0aa';ctx.fillRect(0,H*.07,W,H*.018);ctx.fillRect(W*.055,0,W*.018,H*.72);ctx.fillRect(W*.927,0,W*.018,H*.72);
  // 문 앞에 선 곰돌이 조종사: 얼굴 대신 뒤통수와 낙하산 팩이 보인다.
  const bx=W*.29,by=H*.48,s=Math.min(1.15,W/390);ctx.save();ctx.translate(bx,by);ctx.scale(s,s);
  ell(0,100,40,9,'rgba(48,64,67,.2)');ell(0,52,25,38,'#e78643',OL);rr(-20,24,40,55,12);ctx.fillStyle='#f39a4f';ctx.fill();ctx.strokeStyle=OL;ctx.lineWidth=3;ctx.stroke();
  ctx.strokeStyle='#704f3c';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-18,31);ctx.lineTo(17,70);ctx.moveTo(18,31);ctx.lineTo(-17,70);ctx.stroke();rr(-6,45,12,10,3);ctx.fillStyle='#f6d47e';ctx.fill();ctx.stroke();
  // arms held against the cabin frame
  for(const side of[-1,1]){ctx.lineCap='round';ctx.lineWidth=14;ctx.strokeStyle=OL;ctx.beginPath();ctx.moveTo(side*19,31);ctx.lineTo(side*38,7);ctx.stroke();ctx.lineWidth=9;ctx.strokeStyle='#e78643';ctx.stroke();ell(side*38,7,7,7,'#dcae80',OL);ell(side*10,91,10,7,'#8e5c40',OL)}
  ell(-13,0,10,10,'#dcae80',OL);ell(13,0,10,10,'#dcae80',OL);ell(0,3,21,22,'#dcae80',OL);
  ctx.save();ctx.translate(0,-22);rr(-18,-3,36,17,7);ctx.fillStyle='#d98239';ctx.fill();ctx.strokeStyle=OL;ctx.lineWidth=2.5;ctx.stroke();for(let i=-1;i<=1;i++)ell(i*9,3,5,6,['#ffb35f','#f7e7c0','#ffb35f'][i+1],'#6b4937');ctx.restore();ctx.restore();
  // top HUD, mission and jump control
  const box=(x,y,w,h)=>{rr(x,y,w,h,16);ctx.fillStyle='rgba(255,248,231,.97)';ctx.fill();ctx.strokeStyle='rgba(142,99,62,.35)';ctx.lineWidth=1.5;ctx.stroke()};
  box(14,12,118,44);txt('STAGE 01',73,34,17,'#a45d35','center',false);
  box(W*.36,12,W*.42,44);txt('목표 · 학교 운동장',W*.57,34,14,'#604735','center',false);
  for(let i=0;i<3;i++)drawStar(W*.82+i*25,34,9,-.1);
  box(W*.20,H*.70,W*.60,36);txt('탭해서 뛰어내리기',W*.5,H*.70+18,15,'#604735','center',false);
  const bw=W*.72,bh=58,by0=H*.755;rr((W-bw)/2,by0,bw,bh,23);ctx.fillStyle='#ff6877';ctx.fill();ctx.strokeStyle='#d84d62';ctx.lineWidth=2;ctx.stroke();txt('↓  점프하기',W/2,by0+bh/2,23,'#fff','center',false);
  box(15,H*.91,174,38);txt(`🪂 ${PARACHUTES[gearIndex].name}`,102,H*.91+19,12,'#604735','center',false);
}

function draw(){
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#6db8ff');sky.addColorStop(1,'#dff4ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  if(G.phase==='title'){drawTitle();return}
  const mapView=P.state==='chute'?easeOut(P.chute):(P.state==='landed'?1:0);
  ctx.save();if(P.state==='landed'&&P.landT<.24){const shake=Math.min(8,(P.touchSpeed||0)*.018)*(1-P.landT/.24);ctx.translate(Math.sin(P.landT*62)*shake,Math.cos(P.landT*51)*shake*.55)}
  if(mapView>0)drawAerialMap(mapView);
  else for(const c of clouds){const sy=c.y-camY;if(sy>-60&&sy<H+60)drawCloud(c.x,sy,c.s)}
  const cx=W/2,cy=playerScreenY(),rot=P.rot+P.spin*Math.sin(t*25)*.6;
  if(mapView>0){
    for(const s of stars)if(!s.got&&s.y>P.y+18){const q=mapProject(s.x,s.y);if(q.y>-30&&q.y<H+30)drawStar(q.x,q.y+Math.sin(t*3+s.x)*2,10*q.scale,t)}
    for(const b of birds)if(b.y>P.y){const q=mapProject(b.x,b.y);if(q.y>-30&&q.y<H+30){ctx.save();ctx.translate(q.x,q.y);ctx.scale(q.scale,q.scale);drawBird({x:0,y:0,vx:b.vx,hit:b.hit},0);ctx.restore()}}
    ctx.save();ctx.globalAlpha=mapView;drawTarget();ctx.restore();
  }else{
    for(const s of stars)if(!s.got){const sy=s.y-camY;if(sy>-30&&sy<H+30)drawStar(s.x,sy+Math.sin(t*3+s.x)*3,12,t)}
    for(const b of birds){const sy=b.y-camY;if(sy>-30&&sy<H+30)drawBird(b,sy)}
    if(P.state==='fall'&&P.vy>450){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;for(let i=0;i<7;i++){const lx=(i*97+Math.floor(t*30)*53)%W,ly=((i*131-t*900)%H+H)%H;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx,ly+40);ctx.stroke()}}
  }
  if(P.state==='plane'){
    drawPlane(W*.72,H*.16,Math.sign(plane.vx)||1);drawChar(cx,cy,P.ch,{arms:'cheer',scale:1.1});
    if(Math.sin(t*5)>-.3)txt('탭해서 뛰어내리기!',W/2,H*.57,22,'#ff5c8a');
  }else{
    if(P.state==='fall'&&P.vy>450){ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;for(let i=0;i<7;i++){const lx=(i*97+Math.floor(t*30)*53)%W,ly=cy+((i*41)%120)-60;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx,ly+34);ctx.stroke()}}
    if(P.state==='landed'){
      const r=P.result;
      if(r.safe){const settle=Math.max(0,1-P.landT/.48),impact=clamp((P.touchSpeed-70)/240,0,1);if(settle>0){ctx.save();ctx.globalAlpha=settle*.42;ell(cx,cy+20,14+(1-settle)*24,4+impact*3,null,'#fff');ctx.restore()}
        drawChute(cx,cy,P.chute,P.ch,0,1.55);const hop=r.acc>0?Math.sin(Math.min(1,P.landT/.52)*Math.PI)*18:Math.max(0,Math.sin(Math.min(1,P.landT/.32)*Math.PI))*5;drawChar(cx,cy-hop,P.ch,{arms:r.acc>0?'cheer':'down',scale:1.55,squish:P.landT<.11})}
      else{drawChar(cx,cy+8,P.ch,{squish:true,face:'dizzy'});for(let i=0;i<3;i++){const a=t*4+i*2.1;drawStar(cx+Math.cos(a)*20,cy-14+Math.sin(a)*5,5,a)}}
    }else if(P.state==='chute'&&drawParachuteRig(cx,cy,rot+P.bank*.18)){
      // 분리된 곰돌이와 캐노피 스프라이트를 각각 흔들어 그린다.
    }else{drawChute(cx,cy,P.chute,P.ch,rot+(P.state==='chute'?P.bank*.28:0),1.55);drawChar(cx,cy,P.ch,{rot,arms:P.state==='chute'?'chute':'fall',back:true,face:P.state==='fall'||P.spin>.3?'wow':'happy',scale:1.55})}
  }
  for(const p of parts){const q=mapView>0?mapProject(p.x,p.y):{x:p.x,y:p.y-camY,scale:1};ctx.globalAlpha=Math.min(1,p.life*2);ell(q.x,q.y,p.s*q.scale,p.s*q.scale,p.c)}ctx.globalAlpha=1;
  for(const p of popups){ctx.globalAlpha=1-p.t/1.1;txt(p.text,p.x,p.y-p.t*40,p.size,p.col)}ctx.globalAlpha=1;
  ctx.restore();drawWeatherFX();drawHUD();drawButton();if(P.state==='landed')drawCard();
}
// ---------- 입력 ----------
function action(x,y){
  if(G.phase==='title'){if(x!=null&&y>H*.90){gearIndex=(gearIndex+1)%PARACHUTES.length;sfx(560,.09,'triangle',.1,100);return true}G.stage=1;G.jump=0;G.total=0;newJump();plane.x=W/2;P.x=plane.x;jump();return true}
  if(P.state==='plane'){jump();return true}
  if(P.state==='fall'&&(x==null||Math.hypot(x-58,y-H*.75)<54)){openChute();return true}
  if(P.state==='landed'&&P.landT>1.1){next();return true}
  return false;
}
cv.addEventListener('pointerdown',e=>{audioInit();if(action(e.clientX,e.clientY))return;input.down=true;input.x=input.startX=e.clientX;input.y=input.startY=e.clientY;cv.setPointerCapture?.(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(input.down){input.x=e.clientX;input.y=e.clientY}});
['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,()=>{input.down=false;input.flare=0}));
addEventListener('keydown',e=>{audioInit();if(e.key==='ArrowLeft')input.left=true;if(e.key==='ArrowRight')input.right=true;if(e.key===' '){e.preventDefault();action()}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')input.left=false;if(e.key==='ArrowRight')input.right=false});

let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
