<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fd3ff">
<meta name="game-build" content="v12-worldmap-graphics">
<title>둥실둥실 낙하대</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

const WORLD=4200,GROUND=WORLD-90,MAXALT=1200,PLANE_Y=170,START_Y=PLANE_Y-16,BONUS_ALT=350;
const OL='#4a3a33';
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),easeOut=p=>1-(1-p)*(1-p);
function riverWorldX(y){return W*(.52+.3*Math.sin((y-GROUND)/WORLD*4+1.45)+.045*Math.sin(y/WORLD*12))}
const CHARS=[
  {name:'토토',kind:'bunny',body:'#fff4f0',ear:'#ffc4d0',chute:['#ff8fab','#fff3b0'],trait:'민첩 조종',steer:1.22,wind:0.92,fall:0.96,flare:1.08},
  {name:'삐약',kind:'chick',body:'#ffe27a',ear:'#ffb347',chute:['#7ed6a7','#ffffff'],trait:'가벼운 낙하',steer:1,wind:1.18,fall:0.9,flare:1},
  {name:'몽이',kind:'bear',body:'#dcae80',ear:'#b5835a',chute:['#7ab8ff','#ffd6e8'],trait:'강풍 버팀',steer:0.88,wind:0.76,fall:1.12,flare:0.98}
];
const PARACHUTES=[
  {name:'밸런스 캐노피',desc:'조종과 속도가 고른 기본형',control:1,wind:1,fall:1,flare:1,open:1,wing:1,panels:6},
  {name:'훈련용 캐노피',desc:'천천히 내려와 착지하기 쉬워요',control:1.18,wind:0.78,fall:0.88,flare:1.18,open:1.12,wing:1.08,panels:8},
  {name:'스피드 캐노피',desc:'빠르고 민첩하지만 바람에 약해요',control:1.08,wind:1.22,fall:1.12,flare:0.84,open:0.86,wing:0.88,panels:5}
];
const SITES=[
  {name:'초등학교 운동장',icon:'⚑',kind:'school',x:.22,target:1.12,wind:0.72,moving:false,focus:'넓은 표적 · 기본 착지'},
  {name:'강변 부표',icon:'◉',kind:'lake',x:.79,target:0.7,wind:1.38,moving:true,focus:'이동 표적 · 횡풍 보정'},
  {name:'아파트 옥상',icon:'⌂',kind:'roof',x:.56,target:0.58,wind:1.28,moving:false,focus:'좁은 표적 · 건물 돌풍'}
];
const WEATHERS=[
  {name:'맑음',icon:'☀',wind:0.88,fall:1,dive:0.96,flare:1,open:0.96,gust:0.72,kind:'clear'},
  {name:'돌풍',icon:'➜',wind:1.32,fall:1.02,dive:1.04,flare:0.94,open:1,gust:1.52,kind:'wind'},
  {name:'상승기류',icon:'☁',wind:0.98,fall:0.84,dive:0.92,flare:1.08,open:0.98,gust:0.64,kind:'thermal'},
  {name:'소나기',icon:'☂',wind:1.18,fall:1.13,dive:1.12,flare:0.88,open:1.14,gust:1.18,kind:'rain'}
];

// ---------- 사운드 ----------
let AC=null;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}else if(AC.state==='suspended')AC.resume()}
function sfx(f,d=.12,type='sine',v=.15,slide=0){
  if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),n+d);
  g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d);
}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

// ---------- 안전 개산 고도(실제 물리로 계산) ----------
function surfToAlt(px){return px/(GROUND-22-START_Y)*MAXALT}
const DANGER_ALT=(()=>{
  for(let d=0;d<3000;d+=5){
    let y=0,vy=680,c=0;const dt=1/60;
    while(y<d){c=Math.min(1,c+dt/.6);const tv=680-585*easeOut(c);vy+=(tv-vy)*Math.min(1,(3+5*c)*dt);y+=vy*dt}
    if(vy<190)return Math.round(surfToAlt(d));
  }return 300;
})();
function dangerThreshold(){if(!weather||!gear||!P)return DANGER_ALT;const factor=weather.dive*weather.fall*gear.fall*P.ch.fall*weather.open*gear.open/(Math.max(.5,weather.flare*gear.flare*P.ch.flare));return clamp(Math.round(DANGER_ALT*factor),120,300)}

// ---------- 상태 ----------
let G={stage:1,jump:0,total:0,phase:'title'};
let P,plane,target,wind,weather,gear,site,gearIndex=0,stars=[],birds=[],clouds=[],parts=[],popups=[],scenery=[];
let camY=0,t=0;
const input={down:false,x:0,y:0,startX:0,startY:0,flare:0,left:false,right:false};
for(let i=0;i<8;i++)clouds.push({x:Math.random()*400,y:Math.random()*800,s:rnd(.6,1.3)});

function newJump(){
  const s=G.stage,ch=CHARS[G.jump%3];
  gear=PARACHUTES[gearIndex];weather=WEATHERS[Math.floor(Math.random()*WEATHERS.length)];site=SITES[G.jump%SITES.length];
  const dir=Math.random()<.5?1:-1;
  plane={x:dir>0?-90:W+90,y:PLANE_Y,vx:dir*(150+s*12)};
  const baseWind=(Math.random()<.5?-1:1)*Math.min(32+s*17,115)*rnd(.75,1.15)*site.wind;
  const gusts=[{alt:520,dir:Math.random()<.5?-1:1,power:48*weather.gust,width:105,charge:0,mastered:false},{alt:270,dir:Math.random()<.5?-1:1,power:62*weather.gust,width:82,charge:0,mastered:false}];
  if(site.kind==='roof')gusts.push({alt:112,dir:Math.random()<.5?-1:1,power:78*weather.gust,width:48,charge:0,mastered:false});
  wind={v:baseWind,current:baseWind,phase:rnd(0,Math.PI*2),active:null,gusts};
  const tw=clamp(Math.max(150-(s-1)*11,76)*site.target,56,160);
  target={x:clamp(W*site.x,W*.12,W*.88),w:tw,vx:0};
  P={x:plane.x,y:START_Y,vx:0,vy:0,ch,state:'plane',chute:0,openAlt:null,stars:0,rot:0,bank:0,spin:0,flare:0,flareGood:false,gustPts:0,landT:0,result:null};
  stars=[];for(let i=0;i<10+s*2;i++)stars.push({x:rnd(30,W-30),y:rnd(600,GROUND-500),got:false});
  birds=[];if(s>=2)for(let i=0;i<Math.min(s,6);i++)birds.push({x:Math.random()*W,y:rnd(900,GROUND-500),vx:rnd(60,120)*(Math.random()<.5?-1:1),hit:false});
  if(!scenery.length){
    // 도시의 구역은 한 번 생성한 뒤 모든 착지 코스에서 같은 월드 좌표를 공유한다.
    const add=(kind,x,y,size,tone=0)=>scenery.push({kind,x,y,size,tone});
    for(let i=0;i<12;i++){const y=GROUND-2350+i*104;add('mountain',W*(.02+(i%4)*.31),y,rnd(1.05,1.55),i%3)}
    for(let row=0;row<7;row++)for(let col=0;col<5;col++){
      const y=GROUND-1550+row*188+(col%2)*42;
      const x=W*(.62+col*.09+rnd(-.025,.025));
      if(Math.abs(x/W-(.52+.16*Math.sin(y/WORLD*5)+.07*Math.sin(y/WORLD*12)))>.12)add('building',x,y,rnd(1.0,1.38),(row+col)%3);
    }
    for(let row=0;row<7;row++)for(let col=0;col<5;col++){
      const y=GROUND-1480+row*205+(col%2)*30,x=W*(.035+col*.073+rnd(-.018,.018));
      add('house',x,y,rnd(.78,1.08),(row+col)%3);
    }
    for(let i=0;i<72;i++){
      const y=rnd(GROUND-2150,GROUND-70),x=W*rnd(.015,.985);
      if(Math.abs(x-riverWorldX(y))>W*.12 && !(Math.abs(x/W-.22)<.12&&y>GROUND-520))add('tree',x,y,rnd(.72,1.18),i%3);
    }
  }
  clouds=[];for(let i=0;i<16;i++)clouds.push({x:Math.random()*W,y:rnd(260,GROUND-600),s:rnd(.6,1.4)});
  camY=0;G.phase='play';
}
function alt(y){return Math.max(0,Math.round(surfToAlt(GROUND-22-y)))}
function burst(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-160,160),vy:rnd(-260,-40),life:rnd(.4,.8),c,s:rnd(2,4)})}
function pop(text,x,y,col,size=22){popups.push({text,x,y,col,size,t:0})}

function jump(){P.state='fall';P.vx=plane.vx*.5;P.vy=-140;sfx(520,.15,'triangle',.15,300);pop('뛰어내려!',W/2,H*.42-44,'#4a3a33',22)}
function openChute(){P.state='chute';P.openAlt=alt(P.y);sfx(300,.25,'sine',.18,500);buzz(20);
  if(P.openAlt<BONUS_ALT)pop(P.openAlt<dangerThreshold()?'늦었다?!':'과감해!',W/2,H*.42-72,'#ff9f1c',24)}

function land(){
  P.touchSpeed=P.vy;
  const s=P.state==='chute'&&P.vy<190;
  const d=Math.abs(P.x-target.x);
  const soft=s&&P.flareGood&&P.vy<120;
  let acc=0,label;
  if(!s)label='꽈당!';
  else if(d<target.w*.14){acc=100;label='퍼펙트!'}
  else if(d<target.w*.5){acc=60;label='좋아요!'}
  else if(d<target.w*.5+18){acc=30;label='아슬아슬!'}
  else label='풀밭 착지';
  const bold=(s&&acc>0&&P.openAlt<BONUS_ALT)?Math.round(clamp((BONUS_ALT-P.openAlt)/Math.max(40,BONUS_ALT-dangerThreshold())*100,0,100)):0;
  const starPts=P.stars*10,windPts=P.gustPts||0;
  const pts=s?acc+Math.min(bold,100)+starPts+windPts+(soft&&acc>0?20:0):Math.floor((starPts+windPts)/2);
  P.result={safe:s,soft,softPts:soft&&acc>0?20:0,acc,bold:Math.min(bold,100),starPts,windPts,pts,label,onMat:s&&acc>0};
  P.state='landed';P.vx=0;P.vy=0;P.landT=0;G.total+=pts;
  if(!s){sfx(160,.35,'sawtooth',.12,-100);buzz(120);burst(P.x,P.y+18,'#a0794f',14)}
  else if(acc===100){[660,880,1100].forEach((f,i)=>setTimeout(()=>sfx(f,.18,'triangle',.14),i*90));burst(P.x,P.y,'#ffd84d',soft?30:20);buzz(soft?55:40);if(soft)pop('사뿐! +20',W/2,H*.42-52,'#ff8fab',22)}
  else{sfx(soft?780:660,.15,'triangle',.12);burst(P.x,P.y+10,soft?'#ffe9a8':'#ffffff',soft?20:10);if(soft&&acc>0)pop('사뿐! +20',W/2,H*.42-52,'#ff8fab',22)}
}
function next(){G.jump++;if(G.jump%3===0)G.stage++;newJump()}

// ---------- 업데이트 ----------
function update(dt){
  t+=dt;
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.life-=dt}parts=parts.filter(p=>p.life>0);
  for(const p of popups)p.t+=dt;popups=popups.filter(p=>p.t<1.1);
  if(G.phase!=='play')return;
  plane.x+=plane.vx*dt;
  if(P.state==='plane'){
    if(plane.vx>0&&plane.x>W+90)plane.x=-90;if(plane.vx<0&&plane.x<-90)plane.x=W+90;
    P.x=plane.x;P.y=START_Y;
  }
  for(const b of birds){b.x+=b.vx*dt;if(b.x<-40)b.x=W+40;if(b.x>W+40)b.x=-40}

  if(P.state==='fall'||P.state==='chute'){
    let steer=(input.right?1:0)-(input.left?1:0);
    if(input.down)steer=P.state==='chute'?clamp((input.x-input.startX)/68,-1,1):clamp((input.x-P.x)/50,-1,1);
    if(P.state==='fall'){
      const dive=weather.dive*P.ch.fall;
      P.vy=Math.min(P.vy+950*dive*dt,680*dive);
      P.vx+=(steer*1050*P.ch.steer+wind.v*.55*weather.wind*site.wind*P.ch.wind-P.vx*1.55)*dt;P.vx=clamp(P.vx,-330,330);
      P.bank+=(steer*P.ch.steer-P.bank)*Math.min(1,dt*8);
    }else{
      P.chute=Math.min(1,P.chute+dt/(.6*gear.open*weather.open));const e=easeOut(P.chute);
      const pullDown=input.down?clamp((input.y-input.startY-22)/48,0,1):0;
      const currentAlt=alt(P.y);wind.current=wind.v+Math.sin(t*1.65+wind.phase)*14;wind.active=null;
      const gust=wind.gusts.find(g=>Math.abs(currentAlt-g.alt)<g.width);
      if(gust){const strength=1-Math.abs(currentAlt-gust.alt)/gust.width;wind.active=gust;wind.current+=gust.dir*gust.power*strength;
        if(!gust.entered){gust.entered=true;pop('돌풍 구간! 반대로 조종해요',W/2,H*.42-82,'#4f87e8',19);sfx(420,.12,'triangle',.1,120)}
        const fighting=Math.sign(steer)===-gust.dir&&Math.abs(steer)>.35;gust.charge=fighting?gust.charge+dt:Math.max(0,gust.charge-dt*.55);
        if(gust.charge>.42&&!gust.mastered){gust.mastered=true;P.gustPts+=25;pop('바람 읽기! +25',W/2,H*.42-48,'#ffb52e',22);burst(P.x,P.y,'#fff2a8',12);sfx(720,.16,'triangle',.13,260);buzz(18)}
      }
      P.flare+=(pullDown-P.flare)*Math.min(1,dt*10);
      if(P.flare>.45&&alt(P.y)<90&&alt(P.y)>12)P.flareGood=true;
      const pilotBrake=gear.flare*weather.flare*P.ch.flare;
      const tv=(680-585*e-72*P.flare*pilotBrake)*weather.fall*gear.fall*P.ch.fall;P.vy+=(tv-P.vy)*Math.min(1,(3+5*P.chute+2*P.flare)*dt);
      P.bank+=(steer*P.ch.steer-P.bank)*Math.min(1,dt*(steer===0?2.8:4.5)*gear.control);
      P.vx+=(P.bank*820*gear.control+wind.current*1.55*e*weather.wind*site.wind*gear.wind*P.ch.wind-P.vx*1.15)*dt;P.vx=clamp(P.vx,-350,350);
    }
    P.spin*=Math.pow(.05,dt);
    P.rot+=((P.state==='fall'?steer*.35:P.bank*.3+P.vx/650)-P.rot)*Math.min(1,5*dt);
    P.x+=P.vx*dt;P.y+=P.vy*dt;
    if(P.x<16){P.x=16;P.vx=Math.abs(P.vx)*.4}if(P.x>W-16){P.x=W-16;P.vx=-Math.abs(P.vx)*.4}
    for(const s of stars)if(!s.got&&Math.hypot(s.x-P.x,s.y-P.y)<32){s.got=true;P.stars++;sfx(880+P.stars*40,.1,'triangle',.12);burst(s.x,s.y,'#ffd84d',8);pop('+10',W/2,H*.42-48,'#ffb300',18)}
    for(const b of birds)if(!b.hit&&Math.hypot(b.x-P.x,b.y-P.y)<34){b.hit=true;P.vx+=Math.sign(b.vx)*260;P.vy*=.8;P.spin=1;sfx(300,.2,'square',.08,-150);buzz(30);pop('앗!',W/2,H*.42-50,'#ff6b6b',24)}
    const surf=GROUND-22;
    if(P.y>=surf){P.y=surf;land()}
    camY=clamp(P.y-H*.38,0,WORLD-H);
  }else if(P.state==='landed'){
    P.landT+=dt;P.chute=Math.max(0,P.chute-dt*2);
  }
}

// ---------- 그리기 도우미 ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,size,col,align='center',stroke=true){
  ctx.font=`800 ${size}px -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';
  if(stroke){ctx.lineWidth=Math.max(3,size/6);ctx.strokeStyle='#fff';ctx.lineJoin='round';ctx.strokeText(s,x,y)}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function ell(x,y,rx,ry,fill,stroke){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}

function drawChar(x,y,ch,o={}){
  ctx.save();ctx.translate(x,y);ctx.rotate(o.rot||0);ctx.scale(o.scale||1,o.scale||1);if(o.squish)ctx.scale(1.35,.6);
  const arms={fall:[[14,0,28,-8]],chute:[[12,-6,16,-28]],down:[[13,4,20,14]],cheer:[[12,-4,22,-22]]}[o.arms||'down'][0];
  for(const sx of[-1,1]){
    ctx.lineCap='round';ctx.lineWidth=9;ctx.strokeStyle=OL;ctx.beginPath();ctx.moveTo(sx*arms[0],arms[1]);ctx.lineTo(sx*arms[2],arms[3]);ctx.stroke();
    ctx.lineWidth=5.5;ctx.strokeStyle=ch.body;ctx.stroke();
  }
  ell(-7,17,6,4,ch.ear,OL);ell(7,17,6,4,ch.ear,OL);
  if(ch.kind==='bunny'){for(const sx of[-1,1]){ctx.save();ctx.translate(sx*8,-26);ctx.rotate(sx*.15);ell(0,0,5.5,13,ch.body,OL);ell(0,1,2.5,8,ch.ear);ctx.restore()}}
  if(ch.kind==='bear'){for(const sx of[-1,1]){ell(sx*13,-13,7,7,ch.body,OL);ell(sx*13,-13,3.5,3.5,ch.ear)}}
  if(ch.kind==='chick'){ctx.strokeStyle=OL;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-2,-18);ctx.quadraticCurveTo(-6,-28,0,-26);ctx.quadraticCurveTo(4,-30,3,-18);ctx.stroke()}
  ell(0,0,18,18,ch.body,OL);
  const f=o.face||'happy';ctx.fillStyle=OL;ctx.strokeStyle=OL;ctx.lineWidth=2;
  if(f==='dizzy'){for(const sx of[-6,6]){ctx.beginPath();ctx.moveTo(sx-3,-5);ctx.lineTo(sx+3,1);ctx.moveTo(sx+3,-5);ctx.lineTo(sx-3,1);ctx.stroke()}}
  else if(f==='wow'){for(const sx of[-6,6]){ell(sx,-2,3.3,3.8,OL);ell(sx+1,-3.2,1.1,1.1,'#fff')}}
  else{for(const sx of[-6,6])ell(sx,-2,2.4,2.8,OL)}
  ell(-11,5,3.5,2.2,'rgba(255,120,150,.45)');ell(11,5,3.5,2.2,'rgba(255,120,150,.45)');
  if(ch.kind==='chick'){ctx.fillStyle='#ff9f1c';ctx.beginPath();ctx.moveTo(-4,3);ctx.lineTo(4,3);ctx.lineTo(0,8);ctx.closePath();ctx.fill()}
  else if(f==='wow'){ell(0,6,2.6,3.2,OL)}
  else{ctx.beginPath();ctx.arc(-2,5,2,0,Math.PI);ctx.arc(2,5,2,0,Math.PI);ctx.stroke()}
  ctx.restore();
}
function drawChute(x,y,p,ch,rot,scale=1){
  if(p<=0)return;const e=easeOut(p);ctx.save();ctx.translate(x,y);ctx.rotate(rot*.6);
  const pull=P?.state==='chute'?P.flare:0;ctx.scale(scale*1.5*(gear?.wing||1)*(1-.1*pull),scale*.9*(1+.08*pull));const R=58*e,cy=-28-58*e;
  ctx.strokeStyle='rgba(74,58,51,.55)';ctx.lineWidth=1.2;
  for(const k of[-1,-.45,.45,1]){ctx.beginPath();ctx.moveTo(Math.sign(k)*15,-26);ctx.lineTo(k*R,cy);ctx.stroke()}
  const n=gear?.panels||6;
  for(let i=0;i<n;i++){const a0=Math.PI+i*Math.PI/n,a1=a0+Math.PI/n;ctx.beginPath();ctx.moveTo(0,cy);ctx.arc(0,cy,R,a0,a1);ctx.closePath();ctx.fillStyle=ch.chute[i%2];ctx.fill()}
  ctx.fillStyle='rgba(0,0,0,.08)';for(let i=0;i<n;i++){ctx.beginPath();ctx.arc(-R+R/n+i*2*R/n,cy,R/n,0,Math.PI);ctx.fill()}
  ctx.beginPath();ctx.arc(0,cy,R,Math.PI,0);ctx.strokeStyle=OL;ctx.lineWidth=2;ctx.stroke();
  ell(0,cy-R,4*e,4*e,ch.chute[0],OL);
  ctx.restore();
}

  if(G.phase==='title'){drawTitle();return}
  const mapView=P.state==='chute'?easeOut(P.chute):(P.state==='landed'?1:0);
  ctx.save();if(P.state==='landed'&&P.landT<.24){const shake=Math.min(8,(P.touchSpeed||0)*.018)*(1-P.landT/.24);ctx.translate(Math.sin(P.landT*62)*shake,Math.cos(P.landT*51)*shake*.55)}
  if(mapView>0)drawAerialMap(mapView);
  else for(const c of clouds){const sy=c.y-camY;if(sy>-60&&sy<H+60)drawCloud(c.x,sy,c.s)}
  const cx=W/2,cy=H*.42,rot=P.rot+P.spin*Math.sin(t*25)*.6;
  if(mapView>0){
    for(const s of stars)if(!s.got&&s.y>P.y+18){const q=mapProject(s.x,s.y);if(q.y>-30&&q.y<H+30)drawStar(q.x,q.y+Math.sin(t*3+s.x)*2,10*q.scale,t)}
    for(const b of birds)if(b.y>P.y){const q=mapProject(b.x,b.y);if(q.y>-30&&q.y<H+30){ctx.save();ctx.translate(q.x,q.y);ctx.scale(q.scale,q.scale);drawBird({x:0,y:0,vx:b.vx,hit:b.hit},0);ctx.restore()}}
    ctx.save();ctx.globalAlpha=mapView;drawTarget();ctx.restore();
  }else{
    for(const s of stars)if(!s.got){const sy=s.y-camY;if(sy>-30&&sy<H+30)drawStar(s.x,sy+Math.sin(t*3+s.x)*3,12,t)}
    for(const b of birds){const sy=b.y-camY;if(sy>-30&&sy<H+30)drawBird(b,sy)}
    if(P.state==='fall'&&P.vy>450){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;for(let i=0;i<7;i++){const lx=(i*97+Math.floor(t*30)*53)%W,ly=((i*131-t*900)%H+H)%H;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx,ly+40);ctx.stroke()}}
  }
  if(P.state==='plane'){
    drawPlane(W*.72,H*.16,Math.sign(plane.vx)||1);drawChar(cx,cy,P.ch,{arms:'cheer',scale:1.1});
    if(Math.sin(t*5)>-.3)txt('탭해서 뛰어내리기!',W/2,H*.57,22,'#ff5c8a');
  }else{
    if(P.state==='fall'&&P.vy>450){ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;for(let i=0;i<7;i++){const lx=(i*97+Math.floor(t*30)*53)%W,ly=cy+((i*41)%120)-60;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx,ly+34);ctx.stroke()}}
    if(P.state==='landed'){
      const r=P.result;
      if(r.safe){const settle=Math.max(0,1-P.landT/.48),impact=clamp((P.touchSpeed-70)/240,0,1);if(settle>0){ctx.save();ctx.globalAlpha=settle*.42;ell(cx,cy+20,14+(1-settle)*24,4+impact*3,null,'#fff');ctx.restore()}
        drawChute(cx,cy,P.chute,P.ch,0,1.55);const hop=r.acc>0?Math.sin(Math.min(1,P.landT/.52)*Math.PI)*18:Math.max(0,Math.sin(Math.min(1,P.landT/.32)*Math.PI))*5;drawChar(cx,cy-hop,P.ch,{arms:r.acc>0?'cheer':'down',scale:1.55,squish:P.landT<.11})}
      else{drawChar(cx,cy+8,P.ch,{squish:true,face:'dizzy'});for(let i=0;i<3;i++){const a=t*4+i*2.1;drawStar(cx+Math.cos(a)*20,cy-14+Math.sin(a)*5,5,a)}}
    }else{drawChute(cx,cy,P.chute,P.ch,rot+(P.state==='chute'?P.bank*.28:0),1.55);drawChar(cx,cy,P.ch,{rot,arms:P.state==='chute'?'chute':'fall',face:P.state==='fall'||P.spin>.3?'wow':'happy',scale:1.55})}
  }
  for(const p of parts){const q=mapView>0?mapProject(p.x,p.y):{x:p.x,y:p.y-camY,scale:1};ctx.globalAlpha=Math.min(1,p.life*2);ell(q.x,q.y,p.s*q.scale,p.s*q.scale,p.c)}ctx.globalAlpha=1;
  for(const p of popups){ctx.globalAlpha=1-p.t/1.1;txt(p.text,p.x,p.y-p.t*40,p.size,p.col)}ctx.globalAlpha=1;
  ctx.restore();drawWeatherFX();drawHUD();drawButton();if(P.state==='landed')drawCard();
}
// ---------- 입력 ----------
function action(x,y){
  if(G.phase==='title'){if(x!=null&&y>H*.72&&y<H*.83){gearIndex=(gearIndex+1)%PARACHUTES.length;sfx(560,.09,'triangle',.1,100);return true}G.stage=1;G.jump=0;G.total=0;newJump();plane.x=W/2;P.x=plane.x;jump();return true}
  if(P.state==='plane'){jump();return true}
  if(P.state==='fall'&&(x==null||Math.hypot(x-58,y-H*.75)<54)){openChute();return true}
  if(P.state==='landed'&&P.landT>1.1){next();return true}
  return false;
}
cv.addEventListener('pointerdown',e=>{audioInit();if(action(e.clientX,e.clientY))return;input.down=true;input.x=input.startX=e.clientX;input.y=input.startY=e.clientY;cv.setPointerCapture?.(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(input.down){input.x=e.clientX;input.y=e.clientY}});
['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,()=>{input.down=false;input.flare=0}));
addEventListener('keydown',e=>{audioInit();if(e.key==='ArrowLeft')input.left=true;if(e.key==='ArrowRight')input.right=true;if(e.key===' '){e.preventDefault();action()}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')input.left=false;if(e.key==='ArrowRight')input.right=false});

let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
